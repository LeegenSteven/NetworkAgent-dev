- debug:
    var: inventory_hostname

- name: install wireguard
  become: yes
  ansible.builtin.apt:
    name: wireguard
    state: present

- name: set ip forwarding
  become: yes
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: true
    reload: true

- name: generate server config
  become: yes
  template:
    src: server.conf
    dest: /etc/wireguard/wg0.conf
