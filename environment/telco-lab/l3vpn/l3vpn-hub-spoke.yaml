apiVersion: google.dev/v1
kind: VyOSInfrastructure
metadata:
  name: l3vpn-hub-spoke-infra
  namespace: default
  labels:
    type: telco-lab
    environment: lab
spec:
  description: "L3VPN Hub-and-Spoke Infrastructure"
  networks:
    - name: p1-p2
      subnet: "172.16.30.0/24"
      vlan: 301
      network_type: "p2p"
    - name: p1-p3
      subnet: "172.16.40.0/24"
      vlan: 302
      network_type: "p2p"
    - name: p2-p4
      subnet: "172.16.60.0/24"
      vlan: 303
      network_type: "p2p"
    - name: p3-p4
      subnet: "172.16.50.0/24"
      vlan: 304
      network_type: "p2p"
    - name: p1-rr1
      subnet: "172.16.10.0/24"
      vlan: 305
      network_type: "p2p"
    - name: p2-rr1
      subnet: "172.16.20.0/24"
      vlan: 306
      network_type: "p2p"
    - name: p3-rr2
      subnet: "172.16.70.0/24"
      vlan: 307
      network_type: "p2p"
    - name: p4-rr2
      subnet: "172.16.80.0/24"
      vlan: 308
      network_type: "p2p"
    - name: p1-pe1
      subnet: "172.16.90.0/24"
      vlan: 309
      network_type: "p2p"
    - name: p1-pe2
      subnet: "172.16.100.0/24"
      vlan: 310
      network_type: "p2p"
    - name: p3-pe2
      subnet: "172.16.110.0/24"
      vlan: 311
      network_type: "p2p"
    - name: p4-pe3
      subnet: "172.16.140.0/24"
      vlan: 312
      network_type: "p2p"
    - name: management
      subnet: "192.168.122.0/24"
      gateway: "192.168.122.1"
      network_type: "management"
    - name: loopbacks
      subnet: "10.0.0.0/24"
      network_type: "loopback"
  routers:
    - name: "p1"
      hostname: "p1"
      router_id: "10.0.0.3"
      interfaces:
        - name: "eth0"
          network: "management"
        - name: "eth1"
          network: "p1-p2"
        - name: "eth2"
          network: "p1-p3"
        - name: "eth3"
          network: "p1-pe1"
        - name: "eth4"
          network: "p1-rr1"
        - name: "eth5"
          network: "p1-pe2"
        - name: "lo"
          network: "loopbacks"
    - name: "p2"
      hostname: "p2"
      router_id: "10.0.0.4"
      interfaces:
        - name: "eth0"
          network: "management"
        - name: "eth1"
          network: "p1-p2"
        - name: "eth2"
          network: "p2-p4"
        - name: "eth3"
          network: "p2-rr1"
        - name: "lo"
          network: "loopbacks"
    - name: "p3"
      hostname: "p3"
      router_id: "10.0.0.5"
      interfaces:
        - name: "eth0"
          network: "management"
        - name: "eth1"
          network: "p3-pe2"
        - name: "eth2"
          network: "p1-p3"
        - name: "eth3"
          network: "p3-p4"
        - name: "eth4"
          network: "p3-rr2"
        - name: "lo"
          network: "loopbacks"
    - name: "p4"
      hostname: "p4"
      router_id: "10.0.0.6"
      interfaces:
        - name: "eth0"
          network: "management"
        - name: "eth1"
          network: "p4-rr2"
        - name: "eth2"
          network: "p2-p4"
        - name: "eth3"
          network: "p3-p4"
        - name: "eth4"
          network: "p4-pe3"
        - name: "lo"
          network: "loopbacks"
    - name: "rr1"
      hostname: "rr1"
      router_id: "10.0.0.1"
      interfaces:
        - name: "eth0"
          network: "management"
        - name: "eth1"
          network: "p2-rr1"
        - name: "eth2"
          network: "p1-rr1"
        - name: "lo"
          network: "loopbacks"
    - name: "rr2"
      hostname: "rr2"
      router_id: "10.0.0.2"
      interfaces:
        - name: "eth0"
          network: "management"
        - name: "eth1"
          network: "p4-rr2"
        - name: "eth2"
          network: "p3-rr2"
        - name: "lo"
          network: "loopbacks"
    - name: "pe1"
      hostname: "pe1"
      router_id: "10.0.0.7"
      interfaces:
        - name: "eth0"
          network: "management"
        - name: "eth1"
          network: "p1-pe1"
        - name: "lo"
          network: "loopbacks"
    - name: "pe2"
      hostname: "pe2"
      router_id: "10.0.0.8"
      interfaces:
        - name: "eth0"
          network: "management"
        - name: "eth1"
          network: "p1-pe2"
        - name: "eth2"
          network: "p3-pe2"
        - name: "lo"
          network: "loopbacks"
    - name: "pe3"
      hostname: "pe3"
      router_id: "10.0.0.10"
      interfaces:
        - name: "eth0"
          network: "management"
        - name: "eth1"
          network: "p4-pe3"
        - name: "lo"
          network: "loopbacks"
---
apiVersion: google.dev/v1
kind: VyOSUnderlay
metadata:
  name: l3vpn-hub-spoke-underlay
  namespace: default
spec:
  infrastructureRef: l3vpn-hub-spoke-infra
  routing:
    ospf:
      router_id_source: "loopback"
      areas: [{ area_id: "0.0.0.0", type: "backbone" }]
    bgp:
      as_number: 65001
      router_id_source: "loopback"
      route_reflectors: ["10.0.0.1", "10.0.0.2"]
  mpls:
    enabled: true
    ldp:
      router_id_interface: "loopback"
  routers:
    - name: "p1"
      protocols:
        ospf: { enabled: true, areas: ["0.0.0.0"] }
        mpls: { enabled: true, ldp_interfaces: ["eth1", "eth2", "eth3", "eth4", "eth5"] }
    - name: "p2"
      protocols:
        ospf: { enabled: true, areas: ["0.0.0.0"] }
        mpls: { enabled: true, ldp_interfaces: ["eth1", "eth2", "eth3"] }
    - name: "p3"
      protocols:
        ospf: { enabled: true, areas: ["0.0.0.0"] }
        mpls: { enabled: true, ldp_interfaces: ["eth1", "eth2", "eth3", "eth4"] }
    - name: "p4"
      protocols:
        ospf: { enabled: true, areas: ["0.0.0.0"] }
        mpls: { enabled: true, ldp_interfaces: ["eth1", "eth2", "eth3", "eth4"] }
    - name: "rr1"
      protocols:
        ospf: { enabled: true, areas: ["0.0.0.0"] }
        bgp:
          enabled: true
          as_number: 65001
          route_reflector: true
          neighbors:
            - { peer: "10.0.0.7", remote_as: 65001, route_reflector_client: true }
            - { peer: "10.0.0.8", remote_as: 65001, route_reflector_client: true }
            - { peer: "10.0.0.10", remote_as: 65001, route_reflector_client: true }
        mpls: { enabled: true, ldp_interfaces: ["eth1", "eth2"] }
    - name: "rr2"
      protocols:
        ospf: { enabled: true, areas: ["0.0.0.0"] }
        bgp:
          enabled: true
          as_number: 65001
          route_reflector: true
          neighbors:
            - { peer: "10.0.0.7", remote_as: 65001, route_reflector_client: true }
            - { peer: "10.0.0.8", remote_as: 65001, route_reflector_client: true }
            - { peer: "10.0.0.10", remote_as: 65001, route_reflector_client: true }
        mpls: { enabled: true, ldp_interfaces: ["eth1", "eth2"] }
    - name: "pe1"
      protocols:
        ospf: { enabled: true, areas: ["0.0.0.0"] }
        bgp:
          enabled: true
          as_number: 65001
          neighbors: [{ peer: "10.0.0.1", remote_as: 65001 }, { peer: "10.0.0.2", remote_as: 65001 }]
        mpls: { enabled: true, ldp_interfaces: ["eth1"] }
    - name: "pe2"
      protocols:
        ospf: { enabled: true, areas: ["0.0.0.0"] }
        bgp:
          enabled: true
          as_number: 65001
          neighbors: [{ peer: "10.0.0.1", remote_as: 65001 }, { peer: "10.0.0.2", remote_as: 65001 }]
        mpls: { enabled: true, ldp_interfaces: ["eth1", "eth2"] }
    - name: "pe3"
      protocols:
        ospf: { enabled: true, areas: ["0.0.0.0"] }
        bgp:
          enabled: true
          as_number: 65001
          neighbors: [{ peer: "10.0.0.1", remote_as: 65001 }, { peer: "10.0.0.2", remote_as: 65001 }]
        mpls: { enabled: true, ldp_interfaces: ["eth1"] }
---
apiVersion: google.dev/v1
kind: VyOSL3VPN
metadata:
  name: l3vpn-blue-service
  namespace: default
spec:
  underlayRef: l3vpn-hub-spoke-underlay
  services:
    - name: "BLUE_SPOKE"
      type: "l3vpn"
      topology: "spoke"
    - name: "BLUE_HUB"
      type: "l3vpn"
      topology: "hub"
  routers:
    - name: "pe1"
      vrfs:
        - name: "BLUE_SPOKE"
          table: 200
          rd: "10.50.50.1:1011"
          rt_export: ["65035:1011"]
          rt_import: ["65035:1030"]
      bgp:
        vrfs:
          - name: "BLUE_SPOKE"
            neighbors: [{ peer: "10.50.50.2", remote_as: 65035 }]
    - name: "pe2"
      vrfs:
        - name: "BLUE_HUB"
          table: 400
          rd: "10.80.80.1:1011"
          rt_export: ["65035:1030"]
          rt_import: ["65035:1011", "65035:1030"]
      bgp:
        vrfs:
          - name: "BLUE_HUB"
            neighbors: [{ peer: "10.80.80.2", remote_as: 65035 }]
    - name: "pe3"
      vrfs:
        - name: "BLUE_SPOKE"
          table: 200
          rd: "10.60.60.1:1011"
          rt_export: ["65035:1011"]
          rt_import: ["65035:1030"]
      bgp:
        vrfs:
          - name: "BLUE_SPOKE"
            neighbors: [{ peer: "10.60.60.2", remote_as: 65035 }]
