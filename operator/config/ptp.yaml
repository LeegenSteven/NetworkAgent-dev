apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pointtopointservices.google.dev
  labels:
    type: connectivityservice
spec:
  scope: Namespaced
  group: google.dev
  names:
    kind: PointToPointService
    plural: pointtopointservices
    singular: pointtopointservice
    shortNames:
      - ptp
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: |
            This connectivity service creates a wireguard vpn tunnel between two VPC locations
          properties:
            spec:
              type: object
              properties:
                interfaces:
                  description: |
                    Two distinct customer VPC Subnetwork locations to be connected by a single VPN tunnel.
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        description: name of the network
                        type: string
                      namespace:
                        description: network namespace
                        type: string
                  oneOf:
                    - minItems: 2
                      maxItems: 2
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true