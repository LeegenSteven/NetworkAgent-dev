apiVersion: v1
kind: ConfigMap
metadata:
  name: udr-configmap
  labels:
    app: free5gc
data:
  udrcfg.yaml: |
    info:
      version: 1.0.1
      description: UDR initial local configuration

    configuration:
      sbi: # Service-based interface information
        scheme: http # the protocol for sbi (http or https)
        registerIPv4: udr-nudr # IP used to register to NRF
        bindingIPv4: 0.0.0.0  # IP used to bind the service
        port: 8000 # port used to bind the service
        tls: # the local path of TLS key
          pem: config/TLS/udr.pem # UDR TLS Certificate
          key: config/TLS/udr.key # UDR TLS Private key
      mongodb:
        name: free5gc # Database name in MongoDB
        url: mongodb://mongodb:27017 # URL of MongoDB
      nrfUri: http://nrf-nnrf:8000 # a valid URI of NRF

    # the kind of log output
    # debugLevel: how detailed to output, value: trace, debug, info, warn, error, fatal, panic
    # ReportCaller: enable the caller report or not, value: true or false
    logger:
      UDR:
        debugLevel: info
        ReportCaller: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-udr
  labels:
    app: free5gc
    nf: udr
spec:
  selector:
    matchLabels:
      app: free5gc
      nf: udr
  replicas: 1
  template:
    metadata:
      labels:
        app: free5gc
        nf: udr
    spec:
      initContainers:
      - name: wait-udm
        image: busybox:1.32.0
        env:
        - name: DEPENDENCIES
          value: udm-nudm:8000
        command: ["sh", "-c", "until nc -z $DEPENDENCIES; do echo waiting for the SMF; sleep 2; done;"]
      containers:
      - image: europe-west2-docker.pkg.dev/mobie-core-999/networkagent/free5gc:v3.2.0
        name: udr
        ports:
        - containerPort: 8000
        command: ["./udr"]
        args: ["--config", "config/udrcfg.yaml"]   
        env: 
          - name: DB_URI
            value: mongodb://mongodb/free5gc
          - name: GIN_MODE
            value: release
        volumeMounts:
        - mountPath: /free5gc/config/
          name: udr-volume
        resources:
          requests:
            memory: "100Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      volumes:
      - name: udr-volume
        projected:
          sources:
          - configMap:
              name: udr-configmap
---
apiVersion: v1
kind: Service
metadata:
  name: udr-nudr
  labels:
    app: free5gc
    nf: udr
spec:
  ports:
    - port: 8000
  selector:
    app: free5gc
    nf: udr
