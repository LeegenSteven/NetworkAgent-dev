name: telco-local

on:
  push:
    paths:
      - "packages/telco-domain/**"
      - "packages/telco-local/**"
      - "data/samples/lte-demo/**"
      - "data/rca-rules/lte/**"
      - "data/docs/lte/**"
      - "tools/local-stack/**"
      - "tests/e2e/local/**"
      - "docs/security/local-governance-gate.md"
      - "docs/implementation-development-plan-2.0.md"
      - "README.md"
      - ".github/scripts/release_evidence.py"
      - ".github/scripts/test_release_evidence.py"
      - ".github/workflows/telco-local.yml"
  pull_request:
    paths:
      - "packages/telco-domain/**"
      - "packages/telco-local/**"
      - "data/samples/lte-demo/**"
      - "data/rca-rules/lte/**"
      - "data/docs/lte/**"
      - "tools/local-stack/**"
      - "tests/e2e/local/**"
      - "docs/security/local-governance-gate.md"
      - "docs/implementation-development-plan-2.0.md"
      - "README.md"
      - ".github/scripts/release_evidence.py"
      - ".github/scripts/test_release_evidence.py"
      - ".github/workflows/telco-local.yml"

permissions:
  contents: read

jobs:
  local-profile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_DATE_EPOCH: "946684800"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/telco-domain/pyproject.toml
            packages/telco-local/pyproject.toml
      - name: Exercise the fail-closed release-evidence boundary
        if: matrix.python-version == '3.12'
        run: python .github/scripts/test_release_evidence.py
      - name: Install Local Profile and test dependencies
        run: |
          python -m pip install -e "packages/telco-domain[test]"
          python -m pip install -e "packages/telco-local[test]"
      - name: Run domain and Local Profile tests
        run: |
          python -m pytest packages/telco-domain/tests packages/telco-local/tests -q
      - name: Run local-stack safety and Local-only governance E2E tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest tools/local-stack/tests -q -p no:cacheprovider
          python -m pytest \
            tests/e2e/local/test_local_assurance.py \
            tests/e2e/local/test_local_governance.py \
            -q -p no:cacheprovider
          python -c "from telco_local import LOCAL_SIMULATION_ACTION_TYPE, LocalGovernanceEngine; assert LOCAL_SIMULATION_ACTION_TYPE == 'LOCAL_SIMULATION'"
      - name: Exercise the native two-branch defense demonstration
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          mkdir -p release-evidence
          python tools/local-stack/run_defense_demo.py --approve-local-simulation > release-evidence/defense-demo-summary.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path("release-evidence/defense-demo-summary.json").read_text(
                  encoding="utf-8"
              )
          )
          assert report["schema"] == "networkagent-native-defense-demo/1.0"
          assert report["ok"] is True
          assert report["classification"] == "LOCAL_NATIVE_SIMULATION_EVIDENCE"
          assert report["source"]["commit_bound"] is True
          assert report["source"]["commit_sha"] == os.environ["GITHUB_SHA"]
          assert set(report["results"]) == {"success", "failure"}
          assert report["results"]["success"]["terminal"] == {"closed_loop": True, "state": "RESOLVED", "verification": "PASSED"}
          assert report["results"]["failure"]["terminal"] == {"closed_loop": False, "state": "REOPENED", "verification": "FAILED"}
          for item in report["results"].values():
              assert item["exact_retry"]["approval_command_reused"] is True
              assert item["exact_retry"]["terminal_unchanged"] is True
              assert item["exact_retry"]["verification_unchanged"] is True
              assert item["exact_retry"] == {
                  "approval_command_reused": True,
                  "terminal_unchanged": True,
                  "verification_unchanged": True,
              }
          assert set(report["cleanup"]) == {"success", "failure"}
          assert all(
              item["workspace_removed"] is True
              for item in report["cleanup"].values()
          )
          assert report["coverage"]["not_claimed"] == [
              "CLOUD_EXECUTION",
              "CONTAINER_EXECUTION",
              "FULL_G2_SECURITY_CLOSURE",
              "G4_CLOUD_REHEARSAL",
              "G5_FINAL_ACCEPTANCE",
              "REAL_NETWORK_REMEDIATION",
              "REJECTION_OR_EXPIRY_BRANCHES",
          ]
          PY
      - name: Exercise bounded local observability evidence
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python tools/local-stack/run_observability_demo.py --approve-local-simulation > release-evidence/local-observability-summary.json
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          observation = json.loads(
              Path("release-evidence/local-observability-summary.json").read_text(
                  encoding="utf-8"
              )
          )
          assert observation["schema"] == "networkagent-local-observability/1.0"
          assert observation["ok"] is True
          assert observation["source"]["commit_bound"] is True
          assert observation["source"]["commit_sha"] == os.environ["GITHUB_SHA"]
          assert observation["run"]["status"] == "PASS"
          assert observation["run"]["event_count"] == 22
          assert observation["run"]["diagnostic_only"] is True
          assert observation["run"]["error_class"] == "NONE"
          assert observation["run"]["error_code"] is None
          assert len(observation["events"]) == 22
          expected_event_keys = {
              "attempt",
              "branch",
              "duration_ms",
              "error_class",
              "outcome",
              "sequence",
              "stage",
          }
          expected_graph = [
              ("source_revision", "none", 1),
              ("source_cleanliness", "none", 1),
              ("preflight", "none", 1),
              ("workspace_init", "success", 1),
              ("workspace_status", "success", 1),
              ("governance_preview", "success", 1),
              ("approval_execute", "success", 1),
              ("terminal_verify", "success", 1),
              ("approval_execute", "success", 2),
              ("terminal_verify", "success", 2),
              ("workspace_init", "failure", 1),
              ("workspace_status", "failure", 1),
              ("governance_preview", "failure", 1),
              ("approval_execute", "failure", 1),
              ("terminal_verify", "failure", 1),
              ("approval_execute", "failure", 2),
              ("terminal_verify", "failure", 2),
              ("workspace_cleanup", "success", 1),
              ("workspace_cleanup", "failure", 1),
              ("source_revision", "none", 2),
              ("source_cleanliness", "none", 2),
              ("run_finalize", "none", 1),
          ]
          for sequence, item in enumerate(observation["events"], start=1):
              assert set(item) == expected_event_keys
              assert item["sequence"] == sequence
              assert type(item["duration_ms"]) is int
              assert item["duration_ms"] >= 0
              assert item["outcome"] == "SUCCEEDED"
              assert item["error_class"] == "NONE"
          assert [
              (item["stage"], item["branch"], item["attempt"])
              for item in observation["events"]
          ] == expected_graph
          assert observation["business_outcomes"] == {
              "cleanup": {"failure": True, "success": True},
              "exact_retry": {"failure": True, "success": True},
              "failure": {
                  "closed_loop": False,
                  "expected_business_result": True,
                  "state": "REOPENED",
                  "verification": "FAILED",
              },
              "success": {
                  "closed_loop": True,
                  "expected_business_result": True,
                  "state": "RESOLVED",
                  "verification": "PASSED",
              },
          }
          assert len(observation["local_alerts"]) == 4
          assert {item["name"] for item in observation["local_alerts"]} == {
              "LOCAL_CLEANUP_FAILURE",
              "LOCAL_CONTRACT_DRIFT",
              "LOCAL_EXECUTION_FAILURE",
              "LOCAL_RETRY_AMPLIFICATION",
          }
          assert all(
              item["state"] == "OK" for item in observation["local_alerts"]
          )
          assert all(
              item["owner"] and item["threshold"] and item["runbook_anchor"]
              for item in observation["local_alerts"]
          )
          metrics = observation["metrics"]
          allowed_label_keys = {"branch", "error_class", "outcome", "stage"}
          assert metrics["high_cardinality_labels_present"] is False
          assert set(metrics["label_keys"]) == allowed_label_keys
          assert metrics["series"]
          for series in metrics["series"]:
              assert series["name"] == "networkagent_local_stage"
              assert set(series["labels"]) == allowed_label_keys
              assert not {
                  "trace_id",
                  "incident_id",
                  "resource_id",
                  "action_hash",
                  "observation_id",
                  "commit_sha",
              }.intersection(series["labels"])
              assert type(series["event_count"]) is int
              assert type(series["duration_ms"]) is int
          assert observation["correlation"]["observation_id"] == observation["run"]["observation_id"]
          assert observation["correlation"]["source_commit"] == os.environ["GITHUB_SHA"]
          assert observation["correlation"]["propagated_trace"] is False
          assert len(observation["correlation"]["defense_report_sha256"]) == 64
          assert observation["privacy"] == {
              "absolute_paths_recorded": False,
              "child_stderr_recorded": False,
              "child_stdout_recorded": False,
              "environment_recorded": False,
              "high_cardinality_metric_labels": False,
              "raw_arguments_recorded": False,
              "status": "PASS",
          }
          assert observation["coverage"]["not_claimed"] == [
              "OPEN_TELEMETRY_EXPORT",
              "CROSS_HTTP_REPLAY_A2A_MCP_TRACE",
              "PROMETHEUS_METRICS",
              "EXTERNAL_ALERT_DELIVERY",
              "SERVICE_LEVEL_OBJECTIVES",
              "COLLECTOR_FAILURE_TOLERANCE",
              "GATE_E_OR_G5_CLOSURE",
              "CLOUD_OR_PRODUCTION_OBSERVABILITY",
          ]
          report_path = Path(observation["report"]["relative_path"])
          report_bytes = report_path.read_bytes()
          assert hashlib.sha256(report_bytes).hexdigest() == observation["report"]["sha256"]
          persisted = json.loads(report_bytes)
          assert persisted == {
              key: value for key, value in observation.items() if key != "report"
          }
          PY
      - name: Exercise canonical local lifecycle projection evidence
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python tools/local-stack/run_lifecycle_evidence_demo.py --approve-local-simulation > release-evidence/local-lifecycle-summary.json
          python - <<'PY'
          import hashlib
          import json
          import os
          import stat
          from pathlib import Path

          lifecycle = json.loads(
              Path("release-evidence/local-lifecycle-summary.json").read_text(
                  encoding="utf-8"
              )
          )
          assert lifecycle["schema"] == "networkagent-local-lifecycle-evidence/1.0"
          assert lifecycle["ok"] is True
          assert lifecycle["classification"] == "LOCAL_CANONICAL_LIFECYCLE_EVIDENCE"
          assert lifecycle["source"]["commit_bound"] is True
          assert lifecycle["source"]["commit_sha"] == os.environ["GITHUB_SHA"]
          assert set(lifecycle["branches"]) == {"success", "failure"}
          expected_terminal = {"success": "RESOLVED", "failure": "REOPENED"}
          expected_scenario = {
              "success": "LOCAL_SIMULATION_RESOLVED",
              "failure": "LOCAL_SIMULATION_REOPENED",
          }
          expected_counts = {
              "action_runs": 1,
              "approval_decisions": 2,
              "incident_audit_events": 8,
              "incidents": 1,
              "projected_events": 14,
              "rca_reports": 1,
              "remediation_actions": 1,
              "verification_runs": 1,
          }
          expected_invariants = {
              "bindings_exact": True,
              "revision_contiguous": True,
              "side_effects": False,
              "single_execution_attempt": True,
              "single_incident": True,
          }
          expected_event_keys = {
              "component",
              "occurred_at",
              "operation",
              "outcome",
              "record_type",
              "sequence",
          }
          def assert_exact(value, expected):
              assert type(value) is type(expected)
              if isinstance(expected, dict):
                  assert set(value) == set(expected)
                  for key in expected:
                      assert_exact(value[key], expected[key])
              elif isinstance(expected, list):
                  assert len(value) == len(expected)
                  for item, expected_item in zip(value, expected, strict=True):
                      assert_exact(item, expected_item)
              else:
                  assert value == expected
          for branch, projection in lifecycle["branches"].items():
              assert set(projection) == {
                  "classification",
                  "distributed_trace",
                  "invariants",
                  "ordering",
                  "read_only",
                  "record_counts",
                  "revision_groups",
                  "scenario",
                  "schema",
                  "terminal_status",
              }
              assert projection["schema"] == "networkagent-local-lifecycle-projection/1.0"
              assert projection["classification"] == "DERIVED_FROM_DURABLE_CANONICAL_RECORDS"
              assert projection["read_only"] is True
              assert projection["distributed_trace"] is False
              assert projection["ordering"] == "REVISION_GROUPED_ATOMIC_PROJECTION"
              assert projection["scenario"] == expected_scenario[branch]
              assert projection["terminal_status"] == expected_terminal[branch]
              assert_exact(projection["record_counts"], expected_counts)
              assert_exact(projection["invariants"], expected_invariants)
              assert [item["revision"] for item in projection["revision_groups"]] == list(range(8))
              events = [
                  event
                  for group in projection["revision_groups"]
                  for event in group["events"]
              ]
              assert len(events) == 14
              assert [item["sequence"] for item in events] == list(range(1, 15))
              assert all(set(item) == expected_event_keys for item in events)
          assert_exact(lifecycle["proof"], {
              "branch_count": 2,
              "cleanup": {"failure": True, "success": True},
              "exact_retry": {"failure": True, "success": True},
              "projected_event_count": 28,
              "revision_group_count": 16,
              "terminal": {
                  "failure": {
                      "closed_loop": False,
                      "expected_business_result": True,
                      "state": "REOPENED",
                      "verification": "FAILED",
                  },
                  "success": {
                      "closed_loop": True,
                      "expected_business_result": True,
                      "state": "RESOLVED",
                      "verification": "PASSED",
                  },
              },
          })
          assert_exact(lifecycle["privacy"], {
              "absolute_paths_recorded": False,
              "domain_hashes_recorded": False,
              "domain_identifiers_recorded": False,
              "pseudonymous_correlation_recorded": False,
              "raw_records_recorded": False,
              "status": "PASS",
              "workspace_identifiers_recorded": False,
          })
          assert lifecycle["coverage"]["not_claimed"] == [
              "OPEN_TELEMETRY_EXPORT",
              "DISTRIBUTED_TRACE",
              "RUNTIME_STRUCTURED_LOGGING",
              "CROSS_HTTP_REPLAY_A2A_MCP_TRACE",
              "PROMETHEUS_METRICS",
              "SERVICE_LEVEL_OBJECTIVES",
              "EXTERNAL_ALERT_DELIVERY",
              "GATE_E_OR_G5_CLOSURE",
              "CLOUD_OR_PRODUCTION_EXECUTION",
          ]
          forbidden_keys = {
              "action_hash",
              "action_id",
              "approval_id",
              "correlation_id",
              "event_id",
              "incident_id",
              "idempotency_key",
              "report_id",
              "request_id",
              "resource_id",
              "trace_id",
              "verification_id",
              "workspace_id",
          }
          def nested_keys(value):
              if isinstance(value, dict):
                  return set(value).union(*(nested_keys(item) for item in value.values()))
              if isinstance(value, list):
                  return set().union(*(nested_keys(item) for item in value))
              return set()
          persisted_body = {
              key: value for key, value in lifecycle.items() if key != "report"
          }
          assert nested_keys(persisted_body).isdisjoint(forbidden_keys)
          report_candidates = list(
              Path(".local/networkagent-defense").glob(
                  "*/local-lifecycle-report.json"
              )
          )
          assert len(report_candidates) == 1
          report_path = report_candidates[0]
          assert report_path.name == lifecycle["report"]["filename"]
          assert lifecycle["report"]["filename"] == "local-lifecycle-report.json"
          assert not report_path.is_symlink()
          assert stat.S_ISREG(os.lstat(report_path).st_mode)
          report_bytes = report_path.read_bytes()
          assert len(report_bytes) == lifecycle["report"]["bytes"]
          assert hashlib.sha256(report_bytes).hexdigest() == lifecycle["report"]["sha256"]
          assert json.loads(report_bytes) == persisted_body
          PY
      - name: Build both wheels
        run: |
          python -m pip install "build>=1,<2"
          python -m build --wheel --outdir dist/domain packages/telco-domain
          python -m build --wheel --outdir dist/local packages/telco-local
      - name: Smoke-test wheels outside the source tree
        run: |
          python -m pip uninstall -y telco-local telco-domain
          python -m pip install dist/domain/telco_domain-*.whl
          python -m pip install dist/local/telco_local-*.whl
          cd /tmp
          python -c "import telco_domain, telco_local; from telco_local import LOCAL_SIMULATION_ACTION_TYPE, LifecycleProjectionError, LocalGovernanceEngine, build_lifecycle_projection; assert telco_domain.SCHEMA_VERSION == '1.0' and LOCAL_SIMULATION_ACTION_TYPE == 'LOCAL_SIMULATION' and issubclass(LifecycleProjectionError, ValueError) and callable(build_lifecycle_projection)"
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Generate release evidence and audit runtime dependencies
        id: release_evidence
        if: matrix.python-version == '3.12'
        env:
          RELEASE_ARTIFACT_NAME: telco-local-release-py3.12-attempt-${{ github.run_attempt }}
        run: |
          python -m pip install \
            "pip-audit==2.10.1" \
            "setuptools>=77,<83" \
            "wheel>=0.45,<1"
          release_env="$RUNNER_TEMP/telco-local-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -m pip install \
            --ignore-installed \
            --target "$release_env" \
            dist/domain/telco_domain-*.whl \
            dist/local/telco_local-*.whl
          mkdir -p release-evidence
          python .github/scripts/release_evidence.py inventory \
            --environment-path "$release_env" \
            --first-party "telco-domain" \
            --first-party "telco-local" \
            --output release-evidence/runtime-inventory.json \
            --requirements-output release-evidence/runtime-requirements.txt
          set +e
          python .github/scripts/release_evidence.py scan-wheels \
            --wheel-root dist \
            --output release-evidence/wheel-content-scan.json
          python -m pip_audit \
            --requirement release-evidence/runtime-requirements.txt \
            --no-deps \
            --disable-pip \
            --strict \
            --progress-spinner off \
            --timeout 30 \
            --format json \
            --output release-evidence/pip-audit.json
          audit_status=$?
          python -m pip_audit \
            --requirement release-evidence/runtime-requirements.txt \
            --no-deps \
            --disable-pip \
            --strict \
            --progress-spinner off \
            --timeout 30 \
            --format cyclonedx-json \
            --output release-evidence/pip-audit-sbom.cdx.json
          sbom_status=$?
          python .github/scripts/release_evidence.py finalize-sbom \
            --input release-evidence/pip-audit-sbom.cdx.json \
            --output release-evidence/sbom.cdx.json \
            --wheel-root dist \
            --runtime-inventory release-evidence/runtime-inventory.json \
            --runtime-requirements release-evidence/runtime-requirements.txt \
            --expected-wheel "telco_domain-*.whl" \
            --expected-wheel "telco_local-*.whl"
          finalize_status=$?
          if [ "$finalize_status" -ne 0 ]; then sbom_status=2; fi
          set -e
          python .github/scripts/release_evidence.py manifest \
            --wheel-root dist \
            --evidence-root release-evidence \
            --output release-evidence/release-manifest.json \
            --audit-report release-evidence/pip-audit.json \
            --audit-exit-code "$audit_status" \
            --expected-pip-audit-version "2.10.1" \
            --sbom release-evidence/sbom.cdx.json \
            --sbom-exit-code "$sbom_status" \
            --wheel-scan release-evidence/wheel-content-scan.json \
            --expected-wheel "telco_domain-*.whl" \
            --expected-wheel "telco_local-*.whl" \
            --expected-component "telco-domain" \
            --expected-component "telco-local" \
            --python-version "${{ matrix.python-version }}" \
            --artifact-name "$RELEASE_ARTIFACT_NAME" \
            --artifact-retention-days 14 \
            --supplemental-evidence release-evidence/defense-demo-summary.json \
            --supplemental-evidence release-evidence/local-observability-summary.json \
            --supplemental-evidence release-evidence/local-lifecycle-summary.json \
            --summary "$GITHUB_STEP_SUMMARY"
          python .github/scripts/release_evidence.py verify-manifest \
            --manifest release-evidence/release-manifest.json \
            --wheel-root dist \
            --evidence-root release-evidence \
            --expected-wheel "telco_domain-*.whl" \
            --expected-wheel "telco_local-*.whl" \
            --expected-component "telco-domain" \
            --expected-component "telco-local" \
            --audit-exit-code "$audit_status" \
            --sbom-exit-code "$sbom_status" \
            --expected-pip-audit-version "2.10.1" \
            --python-version "${{ matrix.python-version }}" \
            --artifact-name "$RELEASE_ARTIFACT_NAME" \
            --artifact-retention-days 14 \
            --supplemental-evidence release-evidence/defense-demo-summary.json \
            --supplemental-evidence release-evidence/local-observability-summary.json \
            --supplemental-evidence release-evidence/local-lifecycle-summary.json
      - name: Upload release or diagnostic evidence
        id: release_artifact
        if: ${{ always() && matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telco-local-release-py3.12-attempt-${{ github.run_attempt }}
          path: |
            dist/domain/*.whl
            dist/local/*.whl
            release-evidence/*.json
            release-evidence/*.txt
          if-no-files-found: error
          retention-days: 14
      - name: Summarize uploaded artifact
        if: ${{ always() && matrix.python-version == '3.12' && steps.release_artifact.outcome == 'success' }}
        env:
          ARTIFACT_ID: ${{ steps.release_artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.release_artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.release_artifact.outputs.artifact-digest }}
          EVIDENCE_OUTCOME: ${{ steps.release_evidence.outcome }}
        run: |
          classification="DIAGNOSTIC ONLY"
          if [ "$EVIDENCE_OUTCOME" = "success" ] && python -c "import json; from pathlib import Path; raise SystemExit(0 if json.loads(Path('release-evidence/release-manifest.json').read_text())['status'] == 'PASS' else 1)"; then
            classification="VERIFIED RC"
          fi
          {
            echo "### Uploaded GitHub artifact"
            echo ""
            echo "- Classification: **$classification**"
            echo "- Artifact ID: \`$ARTIFACT_ID\`"
            echo "- Download URL: $ARTIFACT_URL"
            echo "- GitHub archive digest (not a wheel digest): \`$ARTIFACT_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
