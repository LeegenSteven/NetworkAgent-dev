---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeNetwork
metadata:
  name: singapore
spec:
  routingMode: REGIONAL
  autoCreateSubnetworks: false
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeSubnetwork
metadata:
  name: singapore-internal
spec:
  ipCidrRange: 10.0.80.0/24
  region: europe-west2
  description: singapore Network
  networkRef:
    name: singapore
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeRouter
metadata:
  name: singapore-router
spec:
  description: singapore router
  region: europe-west2
  networkRef:
    name: singapore
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeRouterNAT
metadata:
  name: 'singapore-nat'
spec:
  region: europe-west2
  routerRef:
    name: singapore-router
  natIpAllocateOption: AUTO_ONLY
  sourceSubnetworkIpRangesToNat: ALL_SUBNETWORKS_ALL_IP_RANGES
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewall
metadata:
  name: singapore-allowed
spec:
  allow:
    - protocol: tcp
      ports:
       - "22"
       - "80"
    # - protocol: icmp
  networkRef:
    name: singapore
  direction: INGRESS
  sourceRanges:
    - 0.0.0.0/0
  targetTags:
    - singapore-allowed
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeInstance
metadata:
  annotations:
    cnrm.cloud.google.com/allow-stopping-for-update: "true"
  name: singapore-app1
spec:
  machineType: e2-small
  zone: europe-west2-a
  bootDisk:
    initializeParams:
      size: 50
      type: pd-ssd
      sourceImageRef:
        external: ubuntu-os-cloud/ubuntu-2204-lts
  networkInterface:
    - subnetworkRef:
        name: singapore-internal
    - subnetworkRef:
        external: https://www.googleapis.com/compute/v1/projects/free5gc-384814/regions/europe-west2/subnetworks/mgmt-subnet
  canIpForward: true
  metadataStartupScript: "sudo apt-get update; sudo apt-get install -yq python3"
  metadata:
    - key: ssh-keys
      value: admin_briannaughton_altostrat_co:ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN57YanONs2q/Eor4Tjv1NRhBGrB59vPFAMZbvlOVtkX briannaughton
  tags:
    - singapore-allowed
