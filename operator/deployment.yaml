---
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: "automation"
  name: networkoperator-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: networkoperator-role-cluster
rules:

  # Framework: knowing which other operators are running (i.e. peering).
  # - apiGroups: [kopf.dev]
  #   resources: [clusterkopfpeerings]
  #   verbs: [list, watch, patch, get]

  # Framework: runtime observation of namespaces & CRDs (addition/deletion).
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]

  # Framework: admission webhook configuration management.
  - apiGroups: [admissionregistration.k8s.io/v1, admissionregistration.k8s.io/v1beta1]
    resources: [validatingwebhookconfigurations, mutatingwebhookconfigurations]
    verbs: [create, patch]

  # Application: read-only access for watching cluster-wide.
  - apiGroups: [google.dev]
    resources: [connectivityservices, wireguardappliances]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: "automation"
  name: networkoperator-role-namespaced
rules:

  # Framework: knowing which other operators are running (i.e. peering).
  # - apiGroups: [kopf.dev]
  #   resources: [kopfpeerings]
  #   verbs: [list, watch, patch, get]

  # Framework: posting the events about the handlers progress/errors.
  - apiGroups: [""]
    resources: [events]
    verbs: [create]

  # Application: watching & handling for the custom resource we declare.
  - apiGroups: [google.dev]
    resources: [connectivityservices, wireguardappliances]
    verbs: [list, watch, patch]

  # Application: other resources it produces and manipulates.
  # Here, we create Jobs+PVCs+Pods, but we do not patch/update/delete them ever.
  # - apiGroups: [batch, extensions]
  #   resources: [jobs]
  #   verbs: [create]
  # - apiGroups: [""]
  #   resources: [pods, persistentvolumeclaims]
  #   verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: networkoperator-rolebinding-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: networkoperator-role-cluster
subjects:
  - kind: ServiceAccount
    name: networkoperator-account
    namespace: "automation"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: "automation"
  name: networkoperator-rolebinding-namespaced
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: networkoperator-role-namespaced
subjects:
  - kind: ServiceAccount
    name: networkoperator-account
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: networkoperator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      application: networkoperator
  template:
    metadata:
      labels:
        application: networkoperator
    spec:
      serviceAccountName: networkoperator-account
      containers:
      - name: networkoperator
        image: europe-west2-docker.pkg.dev/free5gc-384814/networkagent/networkoperator:latest
        imagePullPolicy: Always
        env:
        - name: K8S_AUTH_KUBECONFIG
          value: "/kubeconfig"
