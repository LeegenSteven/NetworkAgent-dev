---
# Basic constant traffic test
apiVersion: guardian.dev/v1
kind: TrafficTest
metadata:
  name: constant-baseline
  namespace: default
  labels:
    scenario: baseline
    pattern: constant
spec:
  source_device: device1
  destination_device: device2
  protocol: TCP
  port: 5201
  duration: 300  # 5 minutes
  bandwidth: 50Mbps
  pattern_type: constant
  concurrent_users: 1
