---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeNetwork
metadata:
  name: newyork
  labels:
    customer: acme
    graph: "true"
spec:
  routingMode: REGIONAL
  autoCreateSubnetworks: false
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeSubnetwork
metadata:
  name: newyork
  labels:
    customer: acme
    graph: "true"
spec:
  ipCidrRange: 10.0.60.0/24
  region: "{{GOOGLE_REGION}}"
  description: newyork Network
  networkRef:
    name: newyork
    namespace: newyork
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewall
metadata:
  name: newyork-allowed
  labels:
    customer: acme
    graph: "true"
spec:
  allow:
    - protocol: tcp
      ports:
       - "0-65535"
    - protocol: udp
      ports:
       - "0-65535"
    - protocol: icmp
  networkRef:
    name: newyork
  direction: INGRESS
  sourceRanges:
    - 0.0.0.0/0
