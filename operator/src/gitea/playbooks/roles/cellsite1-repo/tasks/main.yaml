- name: Create cellsite1 directory
  file:
    path: /opt/cellsite1-repo
    state: directory
    owner: git
    group: git
    mode: 0775

- name: init git repo
  command: sudo -u git git init
  args:
    chdir: /opt/cellsite1-repo

- name: configure git user name
  command: "sudo -u git git config --global user.name 'Network Agent'"
  args:
    chdir: /opt/cellsite1-repo

- name: configure git email
  command: "sudo -u git git config --global user.email 'networkagent@example.com'"
  args:
    chdir: /opt/cellsite1-repo

###############################################
# Master Branch
###############################################
- name: checkout master branch
  command: sudo -u git git checkout -B master
  args:
    chdir: /opt/cellsite1-repo

- name: push cellsite1 files to master
  ansible.builtin.copy:
    src: "{{item}}"
    dest: "/opt/cellsite1-repo/{{item}}"
    owner: git
    group: git
    mode: '0644'
  loop:
   - Readme.md

- name: add to master branch in cellsite1 repo
  command: sudo -u git git add .
  args:
    chdir: /opt/cellsite1-repo

- name: initial commit 
  command: sudo -u git git commit -m "initial commit"
  args:
    chdir: /opt/cellsite1-repo

- name: add remote repo
  command: sudo -u git git remote add origin https://{{ lookup('env', 'WEBAPPS_LOGIN') }}:{{ lookup('env', 'WEBAPPS_PWD') }}@{{external_ip_address}}:3000/networkagent/cellsite1.git
  args:
    chdir: /opt/cellsite1-repo

- name: push to repo
  command: sudo -u git git -c http.sslVerify=false push -u origin master
  args:
    chdir: /opt/cellsite1-repo

###############################################
# Location Branch
###############################################
- name: checkout location branch
  command: sudo -u git git checkout -B location
  args:
    chdir: /opt/cellsite1-repo

- name: push cellsite1 files
  ansible.builtin.copy:
    src: "{{item}}"
    dest: "/opt/cellsite1-repo/{{item}}"
    owner: git
    group: git
    mode: '0644'
  loop:
   - Readme.md

- name: push templated cellsite1 files
  ansible.builtin.template:
    src: "cellsite1.yaml"
    dest: "/opt/cellsite1-repo/cellsite1.yaml"
    owner: git
    group: git
    mode: '0644'

- name: add to location branch in cellsite1 repo
  command: sudo -u git git add .
  args:
    chdir: /opt/cellsite1-repo

- name: cellsite1 files commit 
  command: sudo -u git git commit -m "add location files"
  args:
    chdir: /opt/cellsite1-repo

- name: push to repo
  command: sudo -u git git -c http.sslVerify=false push -u origin location
  args:
    chdir: /opt/cellsite1-repo

###############################################
# Network Function Branch
###############################################
- name: checkout network function branch
  command: sudo -u git git checkout -B networkfunction
  args:
    chdir: /opt/cellsite1-repo

- name: push cellsite1 files
  ansible.builtin.copy:
    src: "{{item}}"
    dest: "/opt/cellsite1-repo/{{item}}"
    owner: git
    group: git
    mode: '0644'
  loop:
   - ueransim.yaml
   - Readme.md

- name: push templated cellsite1 files
  ansible.builtin.template:
    src: "cellsite1.yaml"
    dest: "/opt/cellsite1-repo/cellsite1.yaml"
    owner: git
    group: git
    mode: '0644'

- name: add to network function branch in cellsite1 repo
  command: sudo -u git git add .
  args:
    chdir: /opt/cellsite1-repo

- name: cellsite1 files commit 
  command: sudo -u git git commit -m "add network function files"
