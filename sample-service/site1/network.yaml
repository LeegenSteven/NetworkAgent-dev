---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeSubnetwork
metadata:
  name: site1-external
spec:
  ipCidrRange: 10.100.0.0/24
  region: europe-west2
  description: Site1 External Network
  networkRef:
    name: site1-external
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeNetwork
metadata:
  name: site1-external
spec:
  routingMode: REGIONAL
  autoCreateSubnetworks: false
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeRouter
metadata:
  name: site1-external-router
spec:
  description: site1 external router
  region: europe-west2
  networkRef:
    name: site1-external
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeRouterNAT
metadata:
  name: 'site1-external-nat'
spec:
  region: europe-west2
  routerRef:
    name: site1-external-router
  natIpAllocateOption: AUTO_ONLY
  sourceSubnetworkIpRangesToNat: ALL_SUBNETWORKS_ALL_IP_RANGES
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewall
metadata:
  name: site1-external-ipsec
spec:
  allow:
    - protocol: udp
      ports:
       - "500"
       - "4500"
  networkRef:
    name: site1-external
  direction: INGRESS
  sourceRanges:
    - 0.0.0.0/0
  targetTags:
    - ipsec
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewall
metadata:
  name: site1-external-ssh
spec:
  allow:
    - protocol: tcp
      ports:
       - "22"
  networkRef:
    name: site1-external
  direction: INGRESS
  sourceRanges:
    - 0.0.0.0/0
  targetTags:
    - ssh