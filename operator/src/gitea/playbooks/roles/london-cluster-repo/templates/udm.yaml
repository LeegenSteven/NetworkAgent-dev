apiVersion: v1
kind: ConfigMap
metadata:
  name: udm-configmap
  labels:
    app: free5gc
data:
  udmcfg.yaml: |
    info:
      version: 1.0.2
      description: UDM initial local configuration

    configuration:
      serviceNameList: # the SBI services provided by this UDM, refer to TS 29.503
        - nudm-sdm # Nudm_SubscriberDataManagement service
        - nudm-uecm # Nudm_UEContextManagement service
        - nudm-ueau # Nudm_UEAuthenticationManagement service
        - nudm-ee # Nudm_EventExposureManagement service
        - nudm-pp # Nudm_ParameterProvisionDataManagement service
      sbi: # Service-based interface information
        scheme: http # the protocol for sbi (http or https)
        registerIPv4: udm-nudm # IP used to register to NRF
        bindingIPv4: 0.0.0.0  # IP used to bind the service
        port: 8000 # Port used to bind the service
        tls: # the local path of TLS key
          pem: config/TLS/udm.pem # UDM TLS Certificate
          key: config/TLS/udm.key # UDM TLS Private key
      nrfUri: http://nrf-nnrf:8000 # a valid URI of NRF

      # test data set from TS33501-f60 Annex C.4
      SuciProfile: # Home Network Public Key ID = slice index +1
        - ProtectionScheme: 1 # Protect Scheme: Profile A
          PrivateKey: c53c22208b61860b06c62e5406a7b330c2b577aa5558981510d128247d38bd1d
          PublicKey: 5a8d38864820197c3394b92613b20b91633cbd897119273bf8e4a6f4eec0a650
        - ProtectionScheme: 2 # Protect Scheme: Profile B
          PrivateKey: F1AB1074477EBCC7F554EA1C5FC368B1616730155E0041AC447D6301975FECDA
          PublicKey: 0472DA71976234CE833A6907425867B82E074D44EF907DFB4B3E21C1C2256EBCD15A7DED52FCBB097A4ED250E036C7B9C8C7004C4EEDC4F068CD7BF8D3F900E3B4

    # the kind of log output
    # debugLevel: how detailed to output, value: trace, debug, info, warn, error, fatal, panic
    # ReportCaller: enable the caller report or not, value: true or false
    logger:
      UDM:
        debugLevel: info
        ReportCaller: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-udm
  labels:
    app: free5gc
    nf: udm
    graph: "true"
spec:
  selector:
    matchLabels:
      app: free5gc
      nf: udm
  replicas: 1
  template:
    metadata:
      labels:
        app: free5gc
        nf: udm
    spec:
      initContainers:
      - name: wait-pcf
        image: busybox:1.32.0
        env:
        - name: DEPENDENCIES
          value: pcf-npcf:8000
        command: ["sh", "-c", "until nc -z $DEPENDENCIES; do echo waiting for the SMF; sleep 2; done;"]
      containers:
      - image: {{GOOGLE_REGION}}-docker.pkg.dev/{{GOOGLE_PROJECT}}/networkagent/udm:latest
        name: udm
        ports:
        - containerPort: 8000
        command: ["./udm"]
        args: ["--config", "config/udmcfg.yaml"]   
        env:
          - name: GIN_MODE
            value: release
        volumeMounts:
        - mountPath: /free5gc/config/
          name: udm-volume
        resources:
          requests:
            memory: "100Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      volumes:
      - name: udm-volume
        projected:
          sources:
          - configMap:
              name: udm-configmap
---
apiVersion: v1
kind: Service
metadata:
  name: udm-nudm
  labels:
    app: free5gc
    nf: udm
spec:
  ports:
    - port: 8000
  selector:
    app: free5gc
    nf: udm
