---
apiVersion: gkehub.cnrm.cloud.google.com/v1beta1
kind: GKEHubFeatureMembership
metadata:
  annotations:
    cnrm.cloud.google.com/project-id: {{GOOGLE_PROJECT}}
  name: london-cluster-feature-membership
spec:
  projectRef:
    name: {{GOOGLE_PROJECT}}
  location: global
  # membershipLocation needs to be explicitly set here because the dependent membership is regional.
  # membershipLocation: {{GOOGLE_REGION}}
  membershipRef:
    name: london-cluster-membership
  featureRef:
    name: london-cluster-feature
  configmanagement:
    configSync:
      sourceFormat: unstructured
      git:
        syncRepo: "https://networkagent:password123@{{external_ip_address}}:3000/networkagent/london-cluster"
        syncBranch: "master"
        # policyDir: ""
        secretType: "none"
        # noSSLVerify: True
---
apiVersion: gkehub.cnrm.cloud.google.com/v1beta1
kind: GKEHubFeature
metadata:
  name: london-cluster-feature
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  projectRef:
    name: {{GOOGLE_PROJECT}}
  location: global
  # The resourceID must be "configmanagement" if you want to use Anthos config
  # management feature.
  resourceID: configmanagement
---
apiVersion: gkehub.cnrm.cloud.google.com/v1beta1
kind: GKEHubMembership
metadata:
  name: london-cluster-membership
spec:
  location: global
  authority:
    # Issuer must contain a link to a valid JWT issuer. Your ContainerCluster is one. To use it, replace ${PROJECT_ID?} with your project ID.
    issuer: https://container.googleapis.com/v1/projects/{{GOOGLE_PROJECT}}/locations/{{GOOGLE_REGION}}/clusters/london-cluster
  description: London Cluster GKE Hub membership
  endpoint:
    gkeCluster:
      resourceRef:
        name: london-cluster
---
apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerCluster
metadata:
  name: london-cluster
  annotations:
    cnrm.cloud.google.com/project-id: {{GOOGLE_PROJECT}}
  labels:
    graph: "true"
spec:
  description: London Cluster
  enableAutopilot: false
  location: "{{GOOGLE_REGION}}"
  initialNodeCount: 5
  defaultMaxPodsPerNode: 16
  releaseChannel:
    channel: STABLE
  workloadIdentityConfig:
    workloadPool: "{{GOOGLE_PROJECT}}.svc.id.goog"
  networkingMode: VPC_NATIVE
  ipAllocationPolicy:
    servicesSecondaryRangeName: servicesrange
    clusterSecondaryRangeName: clusterrange
  networkRef:
    name: london
    namespace: london
  subnetworkRef:
    name: london
    namespace: london
  nodeLocations:
    - "{{GOOGLE_ZONE}}"

---
apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
kind: Project
metadata:
  name: {{GOOGLE_PROJECT}}
  annotations:
    cnrm.cloud.google.com/deletion-policy: "abandon"
spec:
  name: {{GOOGLE_PROJECT}}
  organizationRef:
    external: "655430077612"
