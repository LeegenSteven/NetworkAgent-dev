apiVersion: guardian.dev/v1
kind: VyOSNetwork
metadata:
  name: bandwidth-test-network
  namespace: default
spec:
  description: "Test network demonstrating network-level and per-interface bandwidth constraints"
  
  # Network segments with bandwidth limits (Scenario 1)
  networks:
    - name: management
      subnet: "192.168.122.0/24"
      description: "Management network for operator communication"
      network_type: "management"
      connected_routers:
        - router_name: "r1"
          interface: "eth0"
          ip_address: "192.168.122.10"
        - router_name: "r2"
          interface: "eth0"
          ip_address: "192.168.122.11"
    
    - name: slow-link
      subnet: "10.1.1.0/30"
      description: "Slow point-to-point link (100Mbit network capacity)"
      network_type: "p2p"
      bandwidth: "100mbit"  # Network-level bandwidth limit (Scenario 1)
      connected_routers:
        - router_name: "r1"
          interface: "eth1"
          ip_address: "10.1.1.1"
        - router_name: "r2"
          interface: "eth1"
          ip_address: "10.1.1.2"
    
    - name: fast-backbone
      subnet: "10.2.1.0/30"
      description: "High-speed backbone link (1Gbit network capacity)"
      network_type: "p2p"
      bandwidth: "1gbit"  # Network-level bandwidth limit (Scenario 1)
      connected_routers:
        - router_name: "r1"
          interface: "eth2"
          ip_address: "10.2.1.1"
        - router_name: "r2"
          interface: "eth2"
          ip_address: "10.2.1.2"
    
    - name: customer-lan
      subnet: "192.168.1.0/24"
      description: "Customer LAN network"
      network_type: "multi-access"
      connected_routers:
        - router_name: "r1"
          interface: "eth3"
          ip_address: "192.168.1.1"
    
    - name: loopbacks
      subnet: "10.0.0.0/24"
      description: "Loopback network for router IDs"
      network_type: "loopback"
      connected_routers:
        - router_name: "r1"
          interface: "lo"
          ip_address: "10.0.0.1"
        - router_name: "r2"
          interface: "lo"
          ip_address: "10.0.0.2"

  # Router definitions with per-interface bandwidth limits (Scenario 2)
  routers:
    - name: "r1"
      hostname: "bandwidth-router-1"
      router_id: "1.1.1.1"
      type: "edge"
      role: "gateway"
      image: "vyos:1.5"
      interfaces:
        - name: "eth0"
          network: "management"
          description: "Management interface"
          enabled: true
        
        - name: "eth1"
          network: "slow-link"
          description: "Slow link to R2 - 50Mbit port limit"
          enabled: true
          bandwidth: "50mbit"  # Per-interface limit (Scenario 2)
          # This interface connects to a 100mbit network, but the port itself
          # is limited to 50mbit, simulating a lower-capacity interface card
        
        - name: "eth2"
          network: "fast-backbone"
          description: "Fast backbone to R2 - 500Mbit port limit"
          enabled: true
          bandwidth: "500mbit"  # Per-interface limit (Scenario 2)
          # This interface connects to a 1gbit network, but the port is
          # limited to 500mbit, simulating port contention or QoS policy
        
        - name: "eth3"
          network: "customer-lan"
          description: "Customer LAN interface - 100Mbit port"
          enabled: true
          bandwidth: "100mbit"  # Per-interface limit (Scenario 2)
        
        - name: "lo"
          network: "loopbacks"
          description: "Loopback interface"
          enabled: true
      
      # OSPF routing for connectivity testing
      protocols:
        ospf:
          enabled: true
          areas: ["0.0.0.0"]
    
    - name: "r2"
      hostname: "bandwidth-router-2"
      router_id: "2.2.2.2"
      type: "edge"
      role: "gateway"
      image: "vyos:1.5"
      interfaces:
        - name: "eth0"
          network: "management"
          description: "Management interface"
          enabled: true
        
        - name: "eth1"
          network: "slow-link"
          description: "Slow link to R1 - 50Mbit port limit"
          enabled: true
          bandwidth: "50mbit"  # Per-interface limit (Scenario 2)
        
        - name: "eth2"
          network: "fast-backbone"
          description: "Fast backbone to R1 - 500Mbit port limit"
          enabled: true
          bandwidth: "500mbit"  # Per-interface limit (Scenario 2)
        
        - name: "lo"
          network: "loopbacks"
          description: "Loopback interface"
          enabled: true
      
      protocols:
        ospf:
          enabled: true
          areas: ["0.0.0.0"]
