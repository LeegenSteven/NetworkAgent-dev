---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewall
metadata:
  name: site1-internal-ssh-allow
spec:
  allow:
    - protocol: tcp
      ports:
       - "22"
  networkRef:
    name: site1-internal
  direction: INGRESS
  sourceRanges:
    - 0.0.0.0/0
  targetTags:
    - ssh
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
