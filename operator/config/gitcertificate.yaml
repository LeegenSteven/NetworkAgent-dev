apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gitcertificates.google.dev
spec:
  scope: Namespaced
  group: google.dev
  names:
    kind: GitCertificate
    plural: gitcertificates
    singular: gitcertificate
    shortNames:
      - gitcert
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                cluster:
                  type: object
                  description: the cluster to add the git certificate
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true