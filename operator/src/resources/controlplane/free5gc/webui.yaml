apiVersion: v1
kind: ConfigMap
metadata:
  name: webui-configmap
  labels:
    app: free5gc
data:
  webuicfg.yaml: |
    info:
      version: 1.0.0
      description: Docker-WebUI initial local configuration
    
    configuration:
      mongodb:
        name: free5gc
        url: mongodb://mongodb:27017
    
    # the kind of log output
    # debugLevel: how detailed to output, value: trace, debug, info, warn, error, fatal, panic
    # ReportCaller: enable the caller report or not, value: true or false
    logger:
      WEBUI:
        debugLevel: info
        ReportCaller: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-webui
  labels:
    app: free5gc
spec:
  selector:
    matchLabels:
      app: free5gc
  replicas: 1
  template:
    metadata:
      labels:
        app: free5gc
    spec:
      initContainers:
      - name: wait-mongo
        image: busybox:1.32.0
        env:
        - name: DEPENDENCIES
          value: mongodb:27017
        command: ["sh", "-c", "until nc -z $DEPENDENCIES; do echo waiting for the MongoDB; sleep 2; done;"]
      containers:
      - image: europe-west2-docker.pkg.dev/mobie-core-999/networkagent/free5gc:v3.2.0
        imagePullPolicy: Always
        name: webui
        ports:
        - containerPort: 5000
        command: ["./webui"]
        args: ["--config", "config/webuicfg.yaml"]
        env:
          - name: GIN_MODE
            value: release
        volumeMounts:
        - mountPath: /free5gc/config/
          name: webui-volume
        readinessProbe:
          initialDelaySeconds: 0
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold:  40
          successThreshold: 1
          httpGet:
            port: 5000
        livenessProbe:
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
          httpGet:
            port: 5000
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1024Mi"
            cpu: "1000m"
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      volumes:
      - name: webui-volume
        projected:
          sources:
          - configMap:
              name: webui-configmap
---
apiVersion: v1
kind: Service
metadata:
  name: webui-service
  labels:
    app: free5gc
spec:
  type: NodePort
  ports:
    - port: 5000
      nodePort: 30505
  selector:
    app: free5gc
