---
apiVersion: v1
kind: Namespace
metadata:
  name: "automation"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: "automation"
  name: networkoperator-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: networkoperator-rolebinding-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: networkoperator-account
    namespace: "automation"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graph-operator
  namespace: "automation"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      application: graph-operator
  template:
    metadata:
      labels:
        application: graph-operator
    spec:
      serviceAccountName: networkoperator-account
      containers:
      - name: graph-operator
        image: {{GOOGLE_REGION}}-docker.pkg.dev/{{GOOGLE_PROJECT}}/networkagent/networkoperator:latest
        imagePullPolicy: Always
        env:
        - name: BASEDIR
          value: "/operator"
        - name: GOOGLE_PROJECT
          value: {{GOOGLE_PROJECT}}
        - name: GOOGLE_REGION
          value: {{GOOGLE_REGION}}
        - name: GOOGLE_ZONE
          value: {{GOOGLE_ZONE}}
        - name: GOOGLE_VM_USER
          value: {{GOOGLE_VM_USER}}
        - name: GRAPH
          value: "yes"
        - name: FREE5GC
          value: "yes"
