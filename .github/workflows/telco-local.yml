name: telco-local

on:
  push:
    paths:
      - "packages/telco-domain/**"
      - "packages/telco-local/**"
      - "data/samples/lte-demo/**"
      - "data/rca-rules/lte/**"
      - "data/docs/lte/**"
      - "tools/local-stack/**"
      - "tests/e2e/local/**"
      - "docs/security/local-governance-gate.md"
      - "docs/implementation-development-plan-2.0.md"
      - "README.md"
      - ".github/workflows/telco-local.yml"
  pull_request:
    paths:
      - "packages/telco-domain/**"
      - "packages/telco-local/**"
      - "data/samples/lte-demo/**"
      - "data/rca-rules/lte/**"
      - "data/docs/lte/**"
      - "tools/local-stack/**"
      - "tests/e2e/local/**"
      - "docs/security/local-governance-gate.md"
      - "docs/implementation-development-plan-2.0.md"
      - "README.md"
      - ".github/workflows/telco-local.yml"

permissions:
  contents: read

jobs:
  local-profile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/telco-domain/pyproject.toml
            packages/telco-local/pyproject.toml
      - name: Install Local Profile and test dependencies
        run: |
          python -m pip install -e "packages/telco-domain[test]"
          python -m pip install -e "packages/telco-local[test]"
      - name: Run domain and Local Profile tests
        run: |
          python -m pytest packages/telco-domain/tests packages/telco-local/tests -q
      - name: Run local-stack safety and Local-only governance E2E tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest tools/local-stack/tests -q -p no:cacheprovider
          python -m pytest \
            tests/e2e/local/test_local_assurance.py \
            tests/e2e/local/test_local_governance.py \
            -q -p no:cacheprovider
          python -c "from telco_local import LOCAL_SIMULATION_ACTION_TYPE, LocalGovernanceEngine; assert LOCAL_SIMULATION_ACTION_TYPE == 'LOCAL_SIMULATION'"
      - name: Exercise the real local-stack deployment and approval boundary
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python tools/local-stack/local_stack.py --workspace .local/ci-stack doctor
          python tools/local-stack/local_stack.py --workspace .local/ci-stack init
          python tools/local-stack/local_stack.py --workspace .local/ci-stack status
          python tools/local-stack/local_stack.py --workspace .local/ci-stack --action-mode simulate demo --confirm-incident > /tmp/local-stack-preview.json
          ACTION_HASH=$(python -c 'import json; print(json.load(open("/tmp/local-stack-preview.json", encoding="utf-8"))["result"]["action_preview"]["action_hash"])')
          EXPECTED_REVISION=$(python -c 'import json; print(json.load(open("/tmp/local-stack-preview.json", encoding="utf-8"))["result"]["action_preview"]["expected_revision"])')
          python tools/local-stack/local_stack.py --workspace .local/ci-stack --action-mode simulate demo --approve-action --reason "reviewed isolated CI simulation" --expected-action-hash "$ACTION_HASH" --expected-revision "$EXPECTED_REVISION" > /tmp/local-stack-result.json
          python -c 'import json; result=json.load(open("/tmp/local-stack-result.json", encoding="utf-8"))["result"]; assert result["state"] == "RESOLVED" and result["closed_loop"] is True'
          python tools/local-stack/local_stack.py --workspace .local/ci-stack reset --yes
      - name: Build both wheels
        run: |
          python -m pip install "build>=1,<2"
          python -m build --wheel --outdir dist/domain packages/telco-domain
          python -m build --wheel --outdir dist/local packages/telco-local
      - name: Smoke-test wheels outside the source tree
        run: |
          python -m pip uninstall -y telco-local telco-domain
          python -m pip install dist/domain/telco_domain-*.whl
          python -m pip install dist/local/telco_local-*.whl
          cd /tmp
          python -c "import telco_domain, telco_local; from telco_local import LOCAL_SIMULATION_ACTION_TYPE, LocalGovernanceEngine; assert telco_domain.SCHEMA_VERSION == '1.0' and LOCAL_SIMULATION_ACTION_TYPE == 'LOCAL_SIMULATION'"
      - name: Verify dependency consistency
        run: python -m pip check
