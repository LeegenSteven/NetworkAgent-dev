apiVersion: guardian.dev/v1
kind: VyOSNetwork
metadata:
  name: simple-network
  namespace: default
spec:
  description: "Simple VyOS network with two routers, one device per router, and inter-router routing"
  
  # Network segments
  networks:
    - name: management
      subnet: "192.168.122.0/24"
      description: "Management network for operator communication"
      network_type: "management"
      connected_routers:
        - router_name: "router1"
          interface: "eth0"
          ip_address: "192.168.122.10"
        - router_name: "router2"
          interface: "eth0"
          ip_address: "192.168.122.11"
    
    - name: lan1
      subnet: "10.1.1.0/24"
      gateway: "10.1.1.1"
      description: "LAN network for router1 devices"
      network_type: "multi-access"
      connected_routers:
        - router_name: "router1"
          interface: "eth1"
          ip_address: "10.1.1.1"
    
    - name: lan2
      subnet: "10.2.1.0/24"
      gateway: "10.2.1.1"
      description: "LAN network for router2 devices"
      network_type: "multi-access"
      connected_routers:
        - router_name: "router2"
          interface: "eth1"
          ip_address: "10.2.1.1"
    
    - name: interconnect
      subnet: "192.168.100.0/30"
      description: "Point-to-point link between routers"
      network_type: "p2p"
      connected_routers:
        - router_name: "router1"
          interface: "eth2"
          ip_address: "192.168.100.1"
        - router_name: "router2"
          interface: "eth2"
          ip_address: "192.168.100.2"
    
    - name: loopbacks
      subnet: "10.0.0.0/24"
      description: "Loopback network for router IDs"
      network_type: "loopback"
      connected_routers:
        - router_name: "router1"
          interface: "lo"
          ip_address: "10.0.0.1"
        - router_name: "router2"
          interface: "lo"
          ip_address: "10.0.0.2"

  # Router definition
  routers:
    - name: "router1"
      hostname: "vyos-router1"
      router_id: "1.1.1.1"
      type: "edge"
      role: "gateway"
      image: "vyos:1.5"      
      # Router interfaces (management interface first)
      interfaces:
        - name: "eth0"
          network: "management"
          description: "Management interface"
          enabled: true
        - name: "eth1"
          network: "lan1"
          description: "LAN interface"
          enabled: true
        - name: "eth2"
          network: "interconnect"
          description: "Interconnect to router2"
          enabled: true
        - name: "lo"
          network: "loopbacks"
          description: "Router ID"
          enabled: true
      # OSPF routing protocol
      protocols:
        ospf:
          enabled: true
          areas: ["0.0.0.0"]
        static:
          routes:
            - destination: "192.168.1.0/24"
              next_hop: "192.168.122.4"
              description: "Route to interconnect network via management gateway"

    - name: "router2"
      hostname: "vyos-router2"
      router_id: "2.2.2.2"
      type: "edge"
      role: "gateway"
      image: "vyos:1.5"      
      # Router interfaces (management interface first)
      interfaces:
        - name: "eth0"
          network: "management"
          description: "Management interface"
          enabled: true
        - name: "eth1"
          network: "lan2"
          description: "LAN interface"
          enabled: true
        - name: "eth2"
          network: "interconnect"
          description: "Interconnect to router1"
          enabled: true
        - name: "lo"
          network: "loopbacks"
          description: "Router ID"
          enabled: true      
      # OSPF routing protocol
      protocols:
        ospf:
          enabled: true
          areas: ["0.0.0.0"]
        static:
          routes:
            - destination: "192.168.1.0/24"
              next_hop: "192.168.122.4"
              description: "Route to interconnect network via management gateway"

  # Global routing configuration
  routing:
    ospf:
      router_id_source: "loopback"
      areas:
        - area_id: "0.0.0.0"
          type: "backbone"
          description: "OSPF backbone area for inter-router communication"

---
apiVersion: guardian.dev/v1
kind: Device
metadata:
  name: device1
  namespace: default
spec:
  network_name: "lan1"
  ip_address: "10.1.1.10"
  gateway: "10.1.1.1"

---
apiVersion: guardian.dev/v1
kind: Device
metadata:
  name: device2
  namespace: default
spec:
  network_name: "lan2"
  ip_address: "10.2.1.10"
  gateway: "10.2.1.1"
