---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeNetwork
metadata:
  name: newyork-vpn
spec:
  routingMode: REGIONAL
  autoCreateSubnetworks: false
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeSubnetwork
metadata:
  name: newyork-external
spec:
  ipCidrRange: 10.0.100.0/24
  region: europe-west2
  description: New York External Network
  networkRef:
    name: newyork-vpn
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeRouter
metadata:
  name: newyork-vpn-router
spec:
  description: new york vpn router
  region: europe-west2
  networkRef:
    name: newyork-vpn
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeRouterNAT
metadata:
  name: 'newyork-vpn-nat'
spec:
  region: europe-west2
  routerRef:
    name: newyork-vpn-router
  natIpAllocateOption: AUTO_ONLY
  sourceSubnetworkIpRangesToNat: ALL_SUBNETWORKS_ALL_IP_RANGES
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewall
metadata:
  name: newyork-vpn-wg
spec:
  allow:
    - protocol: udp
      ports:
       - "51820"
  networkRef:
    name: newyork-vpn
  direction: INGRESS
  sourceRanges:
    - 0.0.0.0/0
  targetTags:
    - wireguard
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewall
metadata:
  name: newyork-vpn-ssh
spec:
  allow:
    - protocol: tcp
      ports:
       - "22"
  networkRef:
    name: newyork-vpn
  direction: INGRESS
  sourceRanges:
    - 0.0.0.0/0
  targetTags:
    - ssh