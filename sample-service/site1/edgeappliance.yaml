apiVersion: google.dev/v1
kind: EdgeAppliance
metadata:
  name: edgeappliance-sample
spec:
  service:
    type: mesh
    vendor: wireguard
    name: test-vpn
    secret: some-secret
    sourceSubnets:
      - site1-dev
      - site1-prod
    targetSubnets:
      - site2-dev
      - site2-prod
    peers:
      - edge1
      - edge2