- name: Install pip dependencies for UERANSIM monitor
  ansible.builtin.pip:
    name:
      - psutil

- name: Copy UERANSIM monitor script
  ansible.builtin.copy:
    src: ueransim_monitor.py
    dest: /opt/ueransim_monitor.py
    mode: 0755

- name: Create systemd service for UERANSIM monitor
  ansible.builtin.copy:
    dest: /etc/systemd/system/ueransim_monitor.service
    content: |
      [Unit]
      Description=UERANSIM Monitor Service
      After=docker.service
      Requires=docker.service

      [Service]
      ExecStart=/usr/bin/python3 /opt/ueransim_monitor.py
      Restart=always
      User=root
      Group=root

      [Install]
      WantedBy=multi-user.target
    mode: 0644

- name: Enable and start UERANSIM monitor service
  ansible.builtin.systemd:
    name: ueransim_monitor
    enabled: yes
    state: started

- name: Add handler to reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Add handler to restart ueransim_monitor
  ansible.builtin.systemd:
    name: ueransim_monitor
    state: restarted
