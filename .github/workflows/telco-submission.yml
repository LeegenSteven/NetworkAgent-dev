                  r"(?:/[^\s<>\"'\\/:]+)*"
              ),
          )

          def verify_text_privacy(text):
              if (
                  scheme_pattern.search(text) is not None
                  or protocol_relative_pattern.search(text) is not None
                  or any(
                      pattern.search(text) is not None
                      for pattern in absolute_path_patterns
                  )
                  or any(pattern.search(text) for pattern in secret_patterns)
              ):
                  raise SystemExit(
                      "submission member contains a private path, URL, or secret"
                  )

