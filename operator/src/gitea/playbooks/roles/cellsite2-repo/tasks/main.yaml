- name: Create cellsite2 directory
  file:
    path: /opt/cellsite2-repo
    state: directory
    owner: git
    group: git
    mode: 0775

- name: init git repo
  command: sudo -u git git init
  args:
    chdir: /opt/cellsite2-repo

- name: configure git user name
  command: "sudo -u git git config --global user.name 'Network Agent'"
  args:
    chdir: /opt/cellsite2-repo

- name: configure git email
  command: "sudo -u git git config --global user.email 'networkagent@example.com'"
  args:
    chdir: /opt/cellsite2-repo

###############################################
# Master Branch
###############################################
- name: checkout master branch
  command: sudo -u git git checkout -B master
  args:
    chdir: /opt/cellsite2-repo

- name: push readme files
  ansible.builtin.copy:
    src: "{{item}}"
    dest: "/opt/cellsite2-repo/{{item}}"
    owner: git
    group: git
    mode: '0644'
  loop:
    - Readme.md

- name: add readme to cellsite2 repo
  command: sudo -u git git add .
  args:
    chdir: /opt/cellsite2-repo

- name: initial commit 
  command: sudo -u git git commit -m "initial commit"
  args:
    chdir: /opt/cellsite2-repo

- name: add remote repo
  command: sudo -u git git remote add origin https://{{ lookup('env', 'WEBAPPS_LOGIN') }}:{{ lookup('env', 'WEBAPPS_PWD') }}@{{external_ip_address}}:3000/networkagent/cellsite2.git
  args:
    chdir: /opt/cellsite2-repo

- name: push to repo
  command: sudo -u git git -c http.sslVerify=false push -u origin master
  args:
    chdir: /opt/cellsite2-repo

###############################################
# Location Branch
###############################################
- name: checkout dev branch
  command: sudo -u git git checkout -B location
  args:
    chdir: /opt/cellsite2-repo

- name: push readme files
  ansible.builtin.copy:
    src: "{{item}}"
    dest: "/opt/cellsite2-repo/{{item}}"
    owner: git
    group: git
    mode: '0644'
  loop:
    - Readme.md

- name: push templates files
  ansible.builtin.template:
    src: "cellsite2.yaml"
    dest: "/opt/cellsite2-repo/cellsite2.yaml"
    owner: git
    group: git
    mode: '0644'

- name: add files to location branch in cellsite2 repo
  command: sudo -u git git add .
  args:
    chdir: /opt/cellsite2-repo

- name: location files commit
  command: sudo -u git git commit -m "add location files"
  args:
    chdir: /opt/cellsite2-repo

- name: push to repo
  command: sudo -u git git -c http.sslVerify=false push -u origin location
  args:
    chdir: /opt/cellsite2-repo

###############################################
# Networkfunction Branch
###############################################
- name: checkout networkfunction branch
  command: sudo -u git git checkout -B networkfunction
  args:
    chdir: /opt/cellsite2-repo

- name: push files
  ansible.builtin.copy:
    src: "{{item}}"
    dest: "/opt/cellsite2-repo/{{item}}"
    owner: git
    group: git
    mode: '0644'
  loop:
    - ueransim.yaml
    - Readme.md

- name: push templates files
  ansible.builtin.template:
    src: "cellsite2.yaml"
    dest: "/opt/cellsite2-repo/cellsite2.yaml"
    owner: git
    group: git
    mode: '0644'

- name: add files to nf branch in cellsite2 repo
  command: sudo -u git git add .
  args:
    chdir: /opt/cellsite2-repo

- name: nf files commit
  command: sudo -u git git commit -m "add network function files"
  args:
    chdir: /opt/cellsite2-repo

- name: push to repo
  command: sudo -u git git -c http.sslVerify=false push -u origin networkfunction
  args:
    chdir: /opt/cellsite2-repo

