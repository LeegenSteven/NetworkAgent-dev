- name: Create vpn edge
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: google.dev/v1
      kind: WireguardAppliance
      metadata:
        name: '{{sitename}}'
        namespace: automation
      spec:
        vmname: '{{vmname}}'
        tunnelSubnet: '{{tunnelsubnet}}'
        tunnelAddress: '{{tunneladdress}}'
        allowedInterface: '{{peerinterface}}'
        peer: '{{peername}}'
