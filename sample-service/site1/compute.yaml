apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeInstance
metadata:
  annotations:
    cnrm.cloud.google.com/allow-stopping-for-update: "true"
  name: edge1
spec:
  machineType: e2-highcpu-4
  zone: europe-west2-a
  bootDisk:
    initializeParams:
      size: 50
      type: pd-ssd
      sourceImageRef:
        external: ubuntu-os-cloud/ubuntu-2204-lts
  networkInterface:
    - subnetworkRef:
        name: site1-external
      accessConfig:
        - natIpRef:
            name: edge1-ip
    - subnetworkRef:
        external: https://www.googleapis.com/compute/v1/projects/free5gc-384814/regions/europe-west2/subnetworks/mgmt-subnet
    - subnetworkRef:
        name: site1-dev
  canIpForward: true
  metadataStartupScript: "sudo apt-get update; sudo apt-get install -yq build-essential python3-pip"
  metadata:
    - key: ssh-keys
      value: admin_briannaughton_altostrat_co:ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN57YanONs2q/Eor4Tjv1NRhBGrB59vPFAMZbvlOVtkX briannaughton
  tags:
    - ssh
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeAddress
metadata:
  name: edge1-ip
spec:
  addressType: EXTERNAL
  description: external address
  location: europe-west2
