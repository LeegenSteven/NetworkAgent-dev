- name: Create london cluster repo directory
  file:
    path: /opt/london-cluster-repo
    state: directory
    owner: git
    group: git
    mode: 0775

- name: init git repo
  command: sudo -u git git init
  args:
    chdir: /opt/london-cluster-repo

- name: configure git user name
  command: "sudo -u git git config --global user.name 'Network Agent'"
  args:
    chdir: /opt/london-cluster-repo

- name: configure git email
  command: "sudo -u git git config --global user.email 'networkagent@example.com'"
  args:
    chdir: /opt/london-cluster-repo

###############################################
# Master Branch
###############################################
- name: checkout master branch
  command: sudo -u git git checkout -B master
  args:
    chdir: /opt/london-cluster-repo

- name: push files to master branch
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/london-cluster-repo/{{item}}"
    owner: git
    group: git
    mode: '0644'
  loop:
    - Readme.md
    - smf-crd.yaml

- name: push templated files
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/opt/london-cluster-repo/{{item}}"
    owner: git
    group: git
    mode: '0644'
  loop:
    - graph.yaml

- name: add files to master london-cluster-repo
  command: sudo -u git git add .
  args:
    chdir: /opt/london-cluster-repo

- name: initial commit 
  command: sudo -u git git commit -m "initial commit"
  args:
    chdir: /opt/london-cluster-repo

- name: add remote repo
  command: sudo -u git git remote add origin https://{{ lookup('env', 'WEBAPPS_LOGIN') }}:{{ lookup('env', 'WEBAPPS_PWD') }}@{{ansible_host}}:3000/networkagent/london-cluster.git
  args:
    chdir: /opt/london-cluster-repo

- name: push to master branch in repo
  command: sudo -u git git -c http.sslVerify=false push -u origin master
  args:
    chdir: /opt/london-cluster-repo

###############################################
# Network Function Branch
###############################################
- name: checkout networkfunction branch
  command: sudo -u git git checkout -B networkfunction
  args:
    chdir: /opt/london-cluster-repo

- name: push files to network function branch
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/london-cluster-repo/{{item}}"
    owner: git
    group: git
    mode: '0644'
  loop:
    - smf.yaml

- name: push templated files
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/opt/london-cluster-repo/{{item}}"
    owner: git
    group: git
    mode: '0644'
  loop:
    - ausf.yaml
    - amf.yaml
    - mongodb.yaml
    - nrf.yaml
    - nssf.yaml
    - pcf.yaml
    - udm.yaml
    - udr.yaml
    - webui.yaml

- name: add files to network function branch 
  command: sudo -u git git add .
  args:
    chdir: /opt/london-cluster-repo

- name: nf files commit
  command: sudo -u git git commit -m "add network function files"
  args:
    chdir: /opt/london-cluster-repo

- name: push to network function branch in repo
  command: sudo -u git git -c http.sslVerify=false push -u origin networkfunction
  args:
    chdir: /opt/london-cluster-repo

