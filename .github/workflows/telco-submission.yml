              "manifest.json",
          )
          anchor_tags = re.findall(r"<a\b[^>]*>", page, flags=re.IGNORECASE)
          href_matches = re.findall(
              r"\bhref\s*=\s*([\"'])(.*?)\1",
              page,
              flags=re.IGNORECASE,
          )
          links = tuple(value for _quote, value in href_matches)
          if (
              len(anchor_tags) != 4
              or len(href_matches) != 4
              or links != expected_links
              or any(
                  re.fullmatch(r'<a href="[^"/\\:#]+">', tag) is None
                  for tag in anchor_tags
              )
          ):
              raise SystemExit("submission HTML navigation is invalid")

          reproduce = texts["REPRODUCE.md"]
          if (
              re.search(
                  r"<\s*/?\s*(?:base|iframe|object|embed|script|img|form|style|"
                  r"link|video|audio|svg|meta)\b",
                  reproduce,
                  flags=re.IGNORECASE,
              )
              is not None
              or re.search(
                  r"\b(?:on[a-z0-9_-]+|href|src|srcset|style)\s*=",
                  reproduce,
                  flags=re.IGNORECASE,
              )
              is not None
              or re.search(r"!?\[[^\]\n]*\]\([^\)\n]+\)", reproduce)
              is not None
          ):
              raise SystemExit("REPRODUCE contains a link or active token")
          PY
      - name: Upload the exact Python 3.12 submission directory
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: networkagent-local-submission-py3.12-attempt-${{ github.run_attempt }}
          path: .local/networkagent-submission
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
      - name: Distinguish the inner manifest from the GitHub outer artifact
        shell: bash
        env:
          ARTIFACT_NAME: networkagent-local-submission-py3.12-attempt-${{ github.run_attempt }}
          INNER_MANIFEST_SHA256: ${{ needs.cross-python-equality.outputs.manifest_sha256 }}
          OUTER_ARTIFACT_SHA256: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          inner = os.environ["INNER_MANIFEST_SHA256"]
          outer = os.environ["OUTER_ARTIFACT_SHA256"]
          if re.fullmatch(r"[0-9a-f]{64}", inner) is None:
              raise SystemExit("inner manifest digest is invalid")
          if re.fullmatch(r"[0-9a-f]{64}", outer) is None:
              raise SystemExit("GitHub outer artifact digest is invalid")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
              "a", encoding="utf-8"
          ) as stream:
              stream.write("## Published local submission bundle\n\n")
              stream.write(f"Artifact name: `{os.environ['ARTIFACT_NAME']}`.\n\n")
              stream.write(f"Inner `manifest.json` SHA-256: `{inner}`.\n\n")
              stream.write(f"GitHub outer artifact SHA-256: `{outer}`.\n\n")
              stream.write(
                  "The inner digest binds the project exact-five closure; the "
                  "outer digest binds GitHub's uploaded artifact container. "
                  "They cover different byte domains and are not expected to match.\n"
              )
          PY
