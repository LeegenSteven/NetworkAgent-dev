apiVersion: v1
kind: Service
metadata:
  name: smf-nsmf
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
    networking.gke.io/load-balancer-ip-addresses: "london-cluster-ip-lb"
  labels:
    app: free5gc
    nf: smf
    name: smf
spec:
  type: LoadBalancer
  ports:
    - name: pfcp
      port: 8805
      protocol: UDP
      targetPort: 8805
  selector:
    app: free5gc
    nf: smf
    name: smf
