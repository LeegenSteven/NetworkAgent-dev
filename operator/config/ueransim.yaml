apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ueransims.google.dev
spec:
  scope: Namespaced
  group: google.dev
  names:
    kind: UERanSIM
    plural: ueransims
    singular: ueransim
    shortNames:
      - ue
      - ueransim
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                interface: 
                  description: The VPC network interface
                  type: object
                  properties:
                    name:
                      description: name of the vpc
                      type: string
                    namespace:
                      description: name of the vpc namespace
                      type: string
                amf:
                  description: AMF to connect gNB to
                  type: object
                  properties:
                    url: 
                      description: address of the AMF
                      type: string
                    port: 
                      description: AMF port
                      type: string
                ue: 
                  description: UE simulation details
                  type: string
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true