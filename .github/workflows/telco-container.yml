name: telco-container

on:
  push:
    paths:
      - "deploy/local/**"
      - "tools/local-container/**"
      - "tools/local-stack/local_stack.py"
      - "packages/telco-domain/**"
      - "packages/telco-local/**"
      - "packages/telco-lab/**"
      - "networkagents/assurance/**"
      - "data/samples/lte-demo/**"
      - "data/rca-rules/lte/**"
      - "data/docs/lte/**"
      - "tests/e2e/container/**"
      - ".github/workflows/telco-container.yml"
  pull_request:
    paths:
      - "deploy/local/**"
      - "tools/local-container/**"
      - "tools/local-stack/local_stack.py"
      - "packages/telco-domain/**"
      - "packages/telco-local/**"
      - "packages/telco-lab/**"
      - "networkagents/assurance/**"
      - "data/samples/lte-demo/**"
      - "data/rca-rules/lte/**"
      - "data/docs/lte/**"
      - "tests/e2e/container/**"
      - ".github/workflows/telco-container.yml"

permissions:
  contents: read

concurrency:
  group: telco-container-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_FILE: deploy/local/compose.yaml
  BASE_IMAGE: python:3.12-slim-bookworm@sha256:0f5b26b9518d002b6173fd61daad821fa340635ebfec5bba471013f9ca114579
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2

jobs:
  compose-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install the policy-test runner
        run: python -m pip install "pytest==9.1.1"
      - name: Run container policy tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m pytest
          tools/local-container/tests
          tests/e2e/container
          -q -p no:cacheprovider
      - name: Resolve every profile and enforce the merged model
        run: |
          docker compose \
            --profile ops \
            --profile diagnostics \
            --profile test \
            config --format json > "$RUNNER_TEMP/local-compose.json"
          python tools/local-container/compose_guard.py \
            --resolved-json "$RUNNER_TEMP/local-compose.json" \
            --repository-root .

  build-inspect-smoke:
    needs: compose-policy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Initialize commit-bound container release evidence
        env:
          RELEASE_ARTIFACT_NAME: telco-container-release-attempt-${{ github.run_attempt }}
        run: |
          mkdir -p container-release-evidence
          python tools/local-container/container_release_evidence.py initialize \
            --output container-release-evidence/context.json \
            --artifact-name "$RELEASE_ARTIFACT_NAME" \
            --artifact-retention-days 14
      - name: Build the digest-pinned runtime
        run: docker compose build --pull assurance
      - name: Inspect image identity and runtime-only project contents
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' networkagent-local:dev)
          test -n "$image_id"
          docker image inspect "$image_id" > "$RUNNER_TEMP/local-image.json"
          python - "$RUNNER_TEMP/local-image.json" <<'PY'
          import json
          import sys

          image = json.load(open(sys.argv[1], encoding="utf-8"))[0]
          config = image["Config"]
          assert config["User"] == "10001:10001"
          assert config["Entrypoint"] == [
              "python", "/opt/networkagent/bin/container_entrypoint.py"
          ]
          assert config["Cmd"] == ["serve"]
          assert not config.get("ExposedPorts")
          env = "\n".join(config.get("Env") or []).upper()
          for forbidden in ("GOOGLE_APPLICATION_CREDENTIALS", "HTTP_PROXY", "HTTPS_PROXY"):
              assert forbidden not in env
          PY
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 128 \
            --memory 768m \
            --cpus 1 \
            --user 10001:10001 \
            --entrypoint python \
            "$image_id" -c \
            "from importlib.metadata import distribution; from pathlib import Path; import telco_assurance_agent,telco_domain,telco_lab,telco_local; app=Path('/opt/networkagent'); allowed={'bin/container_entrypoint.py','share/input-manifest.json','tools/local-stack/local_stack.py'}; assert {p.relative_to(app).as_posix() for p in app.rglob('*') if p.is_file()} == allowed; forbidden={'test','tests','build','dist','__pycache__'}; [(_ for _ in ()).throw(AssertionError(str(item))) for name in ('telco-domain','telco-local','telco-lab','telco-assurance-agent') for item in (distribution(name).files or ()) if forbidden.intersection(part.lower() for part in item.parts) or item.suffix in {'.pyc','.pyo'}]; assert not any(Path(path).exists() for path in ('/build','/wheels','/tmp/wheels'))"
      - name: Prove application layers contain no staged wheels, inputs, tests, or caches
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' networkagent-local:dev)
          docker pull "$BASE_IMAGE"
          docker image inspect "$BASE_IMAGE" > "$RUNNER_TEMP/base-image.json"
          docker image inspect "$image_id" > "$RUNNER_TEMP/final-image.json"
          base_layer_count=$(python - "$RUNNER_TEMP/base-image.json" "$RUNNER_TEMP/final-image.json" <<'PY'
          import json
          import sys

          base = json.load(open(sys.argv[1], encoding="utf-8"))[0]["RootFS"]["Layers"]
          final = json.load(open(sys.argv[2], encoding="utf-8"))[0]["RootFS"]["Layers"]
          assert final[:len(base)] == base
          assert len(final) > len(base)
          print(len(base))
          PY
          )
          docker save --output "$RUNNER_TEMP/local-image.tar" networkagent-local:dev
          python tools/local-container/image_layer_guard.py \
            --archive "$RUNNER_TEMP/local-image.tar" \
            --base-layer-count "$base_layer_count"
          inspection_name=networkagent-rootfs-inspection
          cleanup_inspection() {
            docker rm -f "$inspection_name" >/dev/null 2>&1 || true
          }
          trap cleanup_inspection EXIT
          docker create --name "$inspection_name" \
            --entrypoint /bin/true "$image_id" >/dev/null
          docker export --output "$RUNNER_TEMP/local-rootfs.tar" "$inspection_name"
          python tools/local-container/rootfs_guard.py \
            --archive "$RUNNER_TEMP/local-rootfs.tar"
          cleanup_inspection
          trap - EXIT
      - name: Initialize the Docker-managed workspace
        run: docker compose run --rm init
      - name: Start the isolated assurance service and wait for health
        run: |
          docker compose up -d assurance
          container_id=$(docker compose ps -q assurance)
          test -n "$container_id"
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container_id")
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker compose logs assurance
              exit 1
            fi
            sleep 2
          done
          docker compose logs assurance
          exit 1
      - name: Inspect the running isolation boundary
        run: |
          container_id=$(docker compose ps -q assurance)
          docker inspect "$container_id" > "$RUNNER_TEMP/local-container.json"
          python - "$RUNNER_TEMP/local-container.json" <<'PY'
          import json
          import sys

          container = json.load(open(sys.argv[1], encoding="utf-8"))[0]
          host = container["HostConfig"]
          config = container["Config"]
          assert host["NetworkMode"] == "none"
          assert host["ReadonlyRootfs"] is True
          assert host["Privileged"] is False
          assert set(host["CapDrop"]) == {"ALL"}
          assert set(host["SecurityOpt"]) == {"no-new-privileges:true"}
          assert host["PidsLimit"] == 128
          assert host["Memory"] == 805306368
          assert host["NanoCpus"] == 1_000_000_000
          assert not host.get("PortBindings")
          assert not config.get("ExposedPorts")
          assert config["User"] == "10001:10001"
          networks = container["NetworkSettings"].get("Networks") or {}
          assert set(networks).issubset({"none"})
          if "none" in networks:
              endpoint = networks["none"]
              for field in (
                  "Gateway",
                  "IPAddress",
                  "IPv6Gateway",
                  "GlobalIPv6Address",
                  "MacAddress",
              ):
                  assert not endpoint.get(field)
          mounts = {item["Destination"]: item for item in container["Mounts"]}
          workspace = mounts.pop("/var/lib/networkagent")
          assert workspace["Type"] == "volume" and workspace["RW"] is True
          assert set(mounts) == {
              "/opt/networkagent/data/samples/lte-demo/performance.csv",
              "/opt/networkagent/data/samples/lte-demo/safe-cell-traces.csv",
              "/opt/networkagent/data/rca-rules/lte",
              "/opt/networkagent/data/docs/lte",
          }
          assert all(item["Type"] == "bind" and item["RW"] is False for item in mounts.values())
          PY
      - name: Run real shared-loopback verification
        run: |
          docker compose run --rm smoke
          docker compose run --rm probe
      - name: Exercise marker-owned reset
        run: |
          docker compose stop assurance
          docker compose run --rm reset
      - name: Run simulated governance branches and restart recovery
        run: python tools/local-container/run_governance_demo.py
      - name: Install fixed Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: "v0.74.0"
          cache: "false"
      - name: Generate and verify container release evidence
        id: container_release_evidence
        env:
          RELEASE_ARTIFACT_NAME: telco-container-release-attempt-${{ github.run_attempt }}
        run: |
          evidence_root=container-release-evidence
          trivy_cache="$RUNNER_TEMP/networkagent-trivy-cache"
          image_id=$(docker image inspect --format '{{.Id}}' networkagent-local:dev)
          test -n "$image_id"
          trivy_binary=$(command -v trivy)
          test -x "$trivy_binary"
          cp "$RUNNER_TEMP/final-image.json" "$evidence_root/image-inspect.json"
          cp "$RUNNER_TEMP/base-image.json" "$evidence_root/base-image-inspect.json"
          trivy image \
            --cache-dir "$trivy_cache" \
            --db-repository "$TRIVY_DB_REPOSITORY" \
            --download-db-only \
            --no-progress
          trivy version \
            --cache-dir "$trivy_cache" \
            --format json > "$evidence_root/trivy-version.json"
          cp "$trivy_cache/db/metadata.json" "$evidence_root/db-metadata.json"
          set +e
          trivy image \
            --cache-dir "$trivy_cache" \
            --db-repository "$TRIVY_DB_REPOSITORY" \
            --skip-db-update \
            --image-src docker \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            --format json \
            --output "$evidence_root/trivy-vulnerability-all.json" \
            "$image_id"
          full_scan_status=$?
          trivy image \
            --cache-dir "$trivy_cache" \
            --db-repository "$TRIVY_DB_REPOSITORY" \
            --skip-db-update \
            --image-src docker \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --format json \
            --output "$evidence_root/trivy-vulnerability.json" \
            "$image_id"
          scan_status=$?
          trivy image \
            --cache-dir "$trivy_cache" \
            --db-repository "$TRIVY_DB_REPOSITORY" \
            --skip-db-update \
            --image-src docker \
            --format cyclonedx \
            --output "$evidence_root/sbom.cdx.json" \
            "$image_id"
          sbom_status=$?
          python tools/local-container/container_release_evidence.py manifest \
            --evidence-root "$evidence_root" \
            --context "$evidence_root/context.json" \
            --image-inspect "$evidence_root/image-inspect.json" \
            --base-image-inspect "$evidence_root/base-image-inspect.json" \
            --image-archive "$RUNNER_TEMP/local-image.tar" \
            --trivy-version "$evidence_root/trivy-version.json" \
            --trivy-binary "$trivy_binary" \
            --trivy-db "$trivy_cache/db/trivy.db" \
            --db-metadata "$evidence_root/db-metadata.json" \
            --scan-report "$evidence_root/trivy-vulnerability.json" \
            --scan-exit-code "$scan_status" \
            --full-scan-report "$evidence_root/trivy-vulnerability-all.json" \
            --full-scan-exit-code "$full_scan_status" \
            --sbom "$evidence_root/sbom.cdx.json" \
            --sbom-exit-code "$sbom_status" \
            --image-reference networkagent-local:dev \
            --base-image-reference "$BASE_IMAGE" \
            --artifact-name "$RELEASE_ARTIFACT_NAME" \
            --artifact-retention-days 14 \
            --output "$evidence_root/release-manifest.json" \
            --summary "$GITHUB_STEP_SUMMARY"
          manifest_status=$?
          if [ "$manifest_status" -eq 0 ]; then
            python tools/local-container/container_release_evidence.py verify-manifest \
              --evidence-root "$evidence_root" \
              --context "$evidence_root/context.json" \
              --image-inspect "$evidence_root/image-inspect.json" \
              --base-image-inspect "$evidence_root/base-image-inspect.json" \
              --image-archive "$RUNNER_TEMP/local-image.tar" \
              --trivy-version "$evidence_root/trivy-version.json" \
              --trivy-binary "$trivy_binary" \
              --trivy-db "$trivy_cache/db/trivy.db" \
              --db-metadata "$evidence_root/db-metadata.json" \
              --scan-report "$evidence_root/trivy-vulnerability.json" \
              --scan-exit-code "$scan_status" \
              --full-scan-report "$evidence_root/trivy-vulnerability-all.json" \
              --full-scan-exit-code "$full_scan_status" \
              --sbom "$evidence_root/sbom.cdx.json" \
              --sbom-exit-code "$sbom_status" \
              --image-reference networkagent-local:dev \
              --base-image-reference "$BASE_IMAGE" \
              --artifact-name "$RELEASE_ARTIFACT_NAME" \
              --artifact-retention-days 14 \
              --manifest "$evidence_root/release-manifest.json"
            verify_status=$?
          else
            verify_status=1
          fi
          set -e
          if [ "$manifest_status" -ne 0 ] || [ "$verify_status" -ne 0 ]; then
            exit 1
          fi
      - name: Upload container release or diagnostic evidence
        id: container_release_artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telco-container-release-attempt-${{ github.run_attempt }}
          path: |
            container-release-evidence/context.json
            container-release-evidence/image-inspect.json
            container-release-evidence/base-image-inspect.json
            container-release-evidence/trivy-version.json
            container-release-evidence/db-metadata.json
            container-release-evidence/trivy-vulnerability.json
            container-release-evidence/trivy-vulnerability-all.json
            container-release-evidence/sbom.cdx.json
            container-release-evidence/release-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Summarize uploaded container evidence
        if: ${{ always() }}
        env:
          ARTIFACT_DIGEST: ${{ steps.container_release_artifact.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.container_release_artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.container_release_artifact.outputs.artifact-url }}
          EVIDENCE_OUTCOME: ${{ steps.container_release_evidence.outcome }}
          RELEASE_ARTIFACT_NAME: telco-container-release-attempt-${{ github.run_attempt }}
          UPLOAD_OUTCOME: ${{ steps.container_release_artifact.outcome }}
        run: |
          evidence_root=container-release-evidence
          trivy_cache="$RUNNER_TEMP/networkagent-trivy-cache"
          classification="DIAGNOSTIC ONLY"
          artifact_metadata="FAIL"
          normalized_artifact_digest=""
          final_status=1
          if [ "$UPLOAD_OUTCOME" = "success" ] && [ "$EVIDENCE_OUTCOME" = "success" ]; then
            trivy_binary=$(command -v trivy)
            set +e
            python tools/local-container/container_release_evidence.py verify-manifest \
              --evidence-root "$evidence_root" \
              --context "$evidence_root/context.json" \
              --image-inspect "$evidence_root/image-inspect.json" \
              --base-image-inspect "$evidence_root/base-image-inspect.json" \
              --image-archive "$RUNNER_TEMP/local-image.tar" \
              --trivy-version "$evidence_root/trivy-version.json" \
              --trivy-binary "$trivy_binary" \
              --trivy-db "$trivy_cache/db/trivy.db" \
              --db-metadata "$evidence_root/db-metadata.json" \
              --scan-report "$evidence_root/trivy-vulnerability.json" \
              --scan-exit-code 0 \
              --full-scan-report "$evidence_root/trivy-vulnerability-all.json" \
              --full-scan-exit-code 0 \
              --sbom "$evidence_root/sbom.cdx.json" \
              --sbom-exit-code 0 \
              --image-reference networkagent-local:dev \
              --base-image-reference "$BASE_IMAGE" \
              --artifact-name "$RELEASE_ARTIFACT_NAME" \
              --artifact-retention-days 14 \
              --manifest "$evidence_root/release-manifest.json"
            final_status=$?
            set -e
            if [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
              normalized_artifact_digest="sha256:$ARTIFACT_DIGEST"
            elif [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              normalized_artifact_digest="$ARTIFACT_DIGEST"
            fi
            expected_artifact_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${ARTIFACT_ID}"
            if [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] \
              && [[ "$normalized_artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]] \
              && [ "$ARTIFACT_URL" = "$expected_artifact_url" ]; then
              artifact_metadata="PASS"
            else
              final_status=1
            fi
            if [ "$final_status" -eq 0 ] && [ "$artifact_metadata" = "PASS" ]; then
              classification="VERIFIED RUNNER-LOCAL EVIDENCE"
            fi
          fi
          {
            echo "### Uploaded container evidence"
            echo ""
            echo "- Classification: **$classification**"
            echo "- Upload outcome: \`$UPLOAD_OUTCOME\`"
            echo "- Artifact ID: \`${ARTIFACT_ID:-unavailable}\`"
            echo "- Download URL: ${ARTIFACT_URL:-unavailable}"
            echo "- GitHub archive digest: \`${normalized_artifact_digest:-unavailable}\`"
            echo "- GitHub artifact metadata binding: **$artifact_metadata**"
            echo "- Registry image publication: **NOT PERFORMED**"
            echo "- Signing/attestation/provenance: **NOT PERFORMED**"
            echo "- Offline independent re-verification: **NOT AVAILABLE** (image, scanner binary, and database are not uploaded)"
            echo "- Trivy DB registry digest/signature: **NOT CAPTURED**"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$final_status"
      - name: Collect diagnostics on failure
        if: failure()
        run: docker compose logs --no-color assurance
      - name: Remove ephemeral CI state
        if: always()
        run: |
          docker rm -f networkagent-rootfs-inspection >/dev/null 2>&1 || true
          docker compose down --volumes --remove-orphans
