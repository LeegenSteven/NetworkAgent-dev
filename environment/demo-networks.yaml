############# Site 1 Dev ################ 
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeNetwork
metadata:
  name: site1-dev
spec:
  routingMode: REGIONAL
  autoCreateSubnetworks: false
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeSubnetwork
metadata:
  name: site1-dev
spec:
  ipCidrRange: 10.0.10.0/24
  region: europe-west2
  description: Site1 Dev Network
  networkRef:
    name: site1-dev
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewall
metadata:
  name: site1-dev-ssh
spec:
  allow:
    - protocol: tcp
      ports:
       - "22"
  networkRef:
    name: site1-dev
  direction: INGRESS
  sourceRanges:
    - 0.0.0.0/0
  targetTags:
    - ssh
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewall
metadata:
  name: site1-dev-allow-incoming
spec:
  allow:
    - protocol: icmp
  networkRef:
    name: site1-dev
  direction: INGRESS
  sourceRanges:
    - 0.0.0.0/0
  targetTags:
    - incoming
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeRouter
metadata:
  name: site1-dev-router
spec:
  description: site1 router
  region: europe-west2
  networkRef:
    name: site1-dev
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeRouterNAT
metadata:
  name: computerouternat-sample-forallsubnets
spec:
  region: europe-west2
  routerRef:
    name: site1-dev-router
  natIpAllocateOption: AUTO_ONLY
  sourceSubnetworkIpRangesToNat: ALL_SUBNETWORKS_ALL_IP_RANGES

############# Site 1 Prod ################ 
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeNetwork
metadata:
  name: site1-prod
spec:
  routingMode: REGIONAL
  autoCreateSubnetworks: false
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeSubnetwork
metadata:
  name: site1-prod
spec:
  ipCidrRange: 10.0.11.0/24
  region: europe-west2
  description: Site1 Prod Network
  networkRef:
    name: site1-prod
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewall
metadata:
  name: site1-prod-allow-all
spec:
  allow:
    - protocol: icmp
    - protocol: tcp
      ports:
        - "80"
        - "22"
        - "443"
  networkRef:
    name: site1-prod
  direction: INGRESS
  sourceRanges:
    - 0.0.0.0/0
  targetTags:
    - all
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeRouter
metadata:
  name: site1-prod-router
spec:
  description: site1 router
  region: europe-west2
  networkRef:
    name: site1-prod
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeRouterNAT
metadata:
  name: site1-prod-nat
spec:
  region: europe-west2
  routerRef:
    name: site1-prod-router
  natIpAllocateOption: AUTO_ONLY
  sourceSubnetworkIpRangesToNat: ALL_SUBNETWORKS_ALL_IP_RANGES

