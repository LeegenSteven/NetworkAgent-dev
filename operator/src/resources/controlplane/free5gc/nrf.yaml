apiVersion: v1
kind: ConfigMap
metadata:
  name: nrf-configmap
  labels:
    app: free5gc
    nf: nrf
data:
  nrfcfg.yaml: |
    info:
      version: 1.0.1
      description: NRF initial local configuration
    
    configuration:
      MongoDBName: free5gc
      MongoDBUrl: mongodb://mongodb:27017
      sbi:
        scheme: http
        registerIPv4: nrf-nnrf # IP used to serve NFs or register to another NRF
        bindingIPv4: 0.0.0.0  # IP used to bind the service
        port: 8000
        tls: # the local path of TLS key
          pem: config/TLS/nrf.pem # NRF TLS Certificate
          key: config/TLS/nrf.key # NRF TLS Private key
      DefaultPlmnId:
        mcc: 001
        mnc: 01
      serviceNameList:
        - nnrf-nfm
        - nnrf-disc
    
    logger:
      NRF:
        debugLevel: info
        ReportCaller: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-nrf
  labels:
    app: free5gc
    nf: nrf
spec:
  selector:
    matchLabels:
      app: free5gc
      nf: nrf
  replicas: 1
  template:
    metadata:
      labels:
        app: free5gc
        nf: nrf
    spec:
      initContainers:
      - name: wait-mongo
        image: busybox:1.32.0
        env:
        - name: DEPENDENCIES
          value: mongodb:27017
        command: ["sh", "-c", "until nc -z $DEPENDENCIES; do echo waiting for the MongoDB; sleep 2; done;"]
      containers:
      - image: europe-west2-docker.pkg.dev/mobie-core-999/networkagent/free5gc:v3.2.0
        name: nrf
        ports:
        - containerPort: 8000
        command: ["./nrf"]
        args: ["--config", "config/nrfcfg.yaml"]
        env: 
          - name: DB_URI
            value: mongodb://mongodb/free5gc
          - name: GIN_MODE
            value: release
        volumeMounts:
        - mountPath: /free5gc/config/
          name: nrf-volume
        readinessProbe:
          initialDelaySeconds: 0
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold:  40
          successThreshold: 1
          httpGet:
            scheme: "HTTP"
            port: 8000
        livenessProbe:
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
          httpGet:
            scheme: "HTTP"
            port: 8000
        resources:
          requests:
            memory: "100Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      volumes:
      - name: nrf-volume
        projected:
          sources:
          - configMap:
              name: nrf-configmap
---
apiVersion: v1
kind: Service
metadata:
  name: nrf-nnrf
  labels:
    app: free5gc
    nf: nrf
spec:
  ports:
    - port: 8000
  selector:
    app: free5gc
    nf: nrf

