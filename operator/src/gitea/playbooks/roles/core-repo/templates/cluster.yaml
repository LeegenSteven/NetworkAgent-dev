---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeNetwork
metadata:
  name: london-cluster
  labels:
    graph: "false"
spec:
  routingMode: REGIONAL
  autoCreateSubnetworks: false
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeSubnetwork
metadata:
  name: london-cluster
  labels:
    graph: "false"
spec:
  ipCidrRange: 10.0.100.0/24
  region: "{{GOOGLE_REGION}}"
  description: london cluster Network
  networkRef:
    name: london-cluster
  secondaryIpRange:
  - rangeName: servicesrange
    ipCidrRange: 10.5.0.0/16
  - rangeName: clusterrange
    ipCidrRange: 10.6.0.0/16
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewall
metadata:
  name: london-cluster-allowed
  labels:
    customer: acme
    graph: "false"
spec:
  allow:
    - protocol: tcp
      ports:
       - "0-65535"
    - protocol: udp
      ports:
       - "0-65535"
    - protocol: sctp
      ports:
       - "0-65535"
    - protocol: icmp
  networkRef:
    name: london-cluster
  direction: INGRESS
  priority: 500
  sourceRanges:
    - 0.0.0.0/0
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeAddress
metadata:
  name: london-cluster-ip-lb
spec:
  addressType: INTERNAL
  description: a shared IP for london cluster internal load balancer
  location: "{{GOOGLE_REGION}}"
  purpose: SHARED_LOADBALANCER_VIP
  subnetworkRef:
    name: london-cluster
---
apiVersion: gkehub.cnrm.cloud.google.com/v1beta1
kind: GKEHubFeatureMembership
metadata:
  annotations:
    cnrm.cloud.google.com/project-id: {{GOOGLE_PROJECT}}
  name: london-cluster-feature-membership
spec:
  projectRef:
    name: {{GOOGLE_PROJECT}}
  location: global
  membershipRef:
    name: london-cluster-membership
  featureRef:
    name: london-cluster-feature
  configmanagement:
    configSync:
      sourceFormat: unstructured
      git:
        syncRepo: "ssh://git@{{external_ip_address}}:2022/networkagent/london-cluster.git"
        syncBranch: "master"
        secretType: "ssh"
---
apiVersion: gkehub.cnrm.cloud.google.com/v1beta1
kind: GKEHubFeature
metadata:
  name: london-cluster-feature
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  projectRef:
    name: {{GOOGLE_PROJECT}}
  location: global
  resourceID: configmanagement
---
apiVersion: gkehub.cnrm.cloud.google.com/v1beta1
kind: GKEHubMembership
metadata:
  name: london-cluster-membership
spec:
  location: global
  authority:
    issuer: https://container.googleapis.com/v1/projects/{{GOOGLE_PROJECT}}/locations/{{GOOGLE_REGION}}/clusters/london-cluster
  description: London Cluster GKE Hub membership
  endpoint:
    gkeCluster:
      resourceRef:
        name: london-cluster
---
apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
kind: Project
metadata:
  name: {{GOOGLE_PROJECT}}
  annotations:
    cnrm.cloud.google.com/deletion-policy: "abandon"
spec:
  name: {{GOOGLE_PROJECT}}
  organizationRef:
    external: "{{GOOGLE_ORG_NAME}}"
---
apiVersion: google.dev/v1
kind: GitCertificate
metadata:
  name: london-gitcert
spec:
  cluster: 
    name: london-cluster
    namespace: london
---
apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerCluster
metadata:
  name: london-cluster
  annotations:
    cnrm.cloud.google.com/project-id: {{GOOGLE_PROJECT}}
  labels:
    graph: "true"
spec:
  description: London Cluster
  enableAutopilot: false
  enableLegacyAbac: true
  location: "{{GOOGLE_REGION}}"
  enableL4IlbSubsetting: true
  enableMultiNetworking: true
  datapathProvider: ADVANCED_DATAPATH
  gatewayApiConfig:
    channel: CHANNEL_STANDARD
  initialNodeCount: 1
  releaseChannel:
    channel: STABLE
  workloadIdentityConfig:
    workloadPool: "{{GOOGLE_PROJECT}}.svc.id.goog"
  networkingMode: VPC_NATIVE
  ipAllocationPolicy:
    servicesSecondaryRangeName: servicesrange
    clusterSecondaryRangeName: clusterrange
  networkRef:
    name: london-cluster
    namespace: london
  subnetworkRef:
    name: london-cluster
    namespace: london
  nodeLocations:
    - "{{GOOGLE_ZONE}}"
---
apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerNodePool
metadata:
  name: londoncontrolplane
spec:
  location:  "{{GOOGLE_REGION}}"
  initialNodeCount: 2
  maxPodsPerNode: 16
  nodeConfig:
    machineType: n1-standard-4
    diskSizeGb: 100
    diskType: pd-standard
    preemptible: false
    minCpuPlatform: "Intel Haswell"
  networkConfig:
    additionalNodeNetworkConfigs:
      - networkRef:
          external: london
        subnetworkRef:
          external: london
    additionalPodNetworkConfigs:
    - maxPodsPerNode: 8
      secondaryPodRange: controlplane
      subnetworkRef:
        external: london
  clusterRef:
    name: london-cluster