apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewall
metadata:
  name: site1-ssh
spec:
  allow:
    - protocol: tcp
      ports:
       - "22"
  networkRef:
    name: site1
  direction: INGRESS
  sourceRanges:
    - 0.0.0.0/0
  targetTags:
    - ssh
---
