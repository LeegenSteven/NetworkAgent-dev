---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeNetwork
metadata:
  name: sydney
  labels:
    customer: acme
spec:
  routingMode: REGIONAL
  autoCreateSubnetworks: false
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeSubnetwork
metadata:
  name: sydney-internal
  labels:
    customer: acme
spec:
  ipCidrRange: 10.0.70.0/24
  region: europe-west2
  description: sydney Network
  networkRef:
    name: sydney
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeRouter
metadata:
  name: sydney-router
  labels:
    customer: acme
spec:
  description: sydney router
  region: europe-west2
  networkRef:
    name: sydney
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeRouterNAT
metadata:
  name: 'sydney-nat'
  labels:
    customer: acme
spec:
  region: europe-west2
  routerRef:
    name: sydney-router
  natIpAllocateOption: AUTO_ONLY
  sourceSubnetworkIpRangesToNat: ALL_SUBNETWORKS_ALL_IP_RANGES
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewall
metadata:
  name: sydney-allowed
  labels:
    customer: acme
spec:
  allow:
    - protocol: tcp
      ports:
       - "0-65535"
    - protocol: udp
      ports:
       - "0-65535"
    - protocol: icmp
  networkRef:
    name: sydney
  direction: INGRESS
  sourceRanges:
    - 0.0.0.0/0
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeInstance
metadata:
  annotations:
    cnrm.cloud.google.com/allow-stopping-for-update: "true"
  name: sydney-app1
  labels:
    customer: acme
spec:
  machineType: e2-small
  zone: europe-west2-a
  bootDisk:
    initializeParams:
      size: 50
      type: pd-ssd
      sourceImageRef:
        external: ubuntu-os-cloud/ubuntu-2204-lts
  networkInterface:
    - subnetworkRef:
        name: sydney-internal
      accessConfig:
        - natIpRef:
            name: sydney-app1-ip
    - subnetworkRef:
        external: https://www.googleapis.com/compute/v1/projects/free5gc-384814/regions/europe-west2/subnetworks/mgmt-subnet
  canIpForward: true
  metadataStartupScript: "sudo apt-get update; sudo apt-get install -yq python3"
  metadata:
    - key: ssh-keys
      value: admin_briannaughton_altostrat_co:ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN57YanONs2q/Eor4Tjv1NRhBGrB59vPFAMZbvlOVtkX briannaughton
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeAddress
metadata:
  name: sydney-app1-ip
  labels:
    customer: acme
spec:
  addressType: EXTERNAL
  description: external address
  location: europe-west2
