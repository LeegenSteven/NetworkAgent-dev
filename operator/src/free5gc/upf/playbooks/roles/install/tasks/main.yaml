- name: install base apt packages
  ansible.builtin.apt:
    pkg:
      - gnupg-agent
      - apt-transport-https 
      - software-properties-common
      - iproute2
      - python3
      - python3-pip
    state: latest
    update_cache: true

- name: install pip dependencies for docker
  ansible.builtin.pip:
    name:
      - docker

- name: install pip dependencies for metrics collector
  ansible.builtin.pip:
    name:
      - psutil
      - google-cloud-spanner
      - google-cloud-logging

- name: update the version of requests
  command: pip install requests==2.28.1

- name: Add Docker GPG apt Key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker Repository
  apt_repository:
    repo: deb https://download.docker.com/linux/ubuntu focal stable
    state: present

- name: Install docker-ce
  apt:
    pkg:
      - docker-ce 
      - docker-ce-cli 
      - containerd.io
    state: latest
    update_cache: true

- name: create drop in docker distributed dir
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: '0755'

- name: copy environment
  ansible.builtin.copy: 
    src: service.conf
    dest: /etc/systemd/system/docker.service.d/docker-service-override.conf

- name: copy logging options to docker
  ansible.builtin.template: 
    src: daemon.json
    dest: /etc/docker/daemon.json

- name: restart docker
  ansible.builtin.systemd_service:
    state: restarted
    daemon_reload: true
    name: docker

- name: install headers matching kernel
  apt:
    pkg:
    - linux-headers-{{ansible_kernel}}

- name: create /opt/gtp5
  file:
    path: /opt/gtp5
    state: directory
    mode: '0777' 

- name: git checkout from gtp5
  ansible.builtin.git:
    repo: https://github.com/free5gc/gtp5g.git
    dest: /opt/gtp5
    version: "v0.8.10"
    clone: yes  # Ensure the repo is cloned (not just updated)
    update: yes
    force: yes 

- name: Build and install gtp module
  ansible.builtin.shell: |
    make clean
    make
    make install
  args:
    chdir: /opt/gtp5

- name: download networkagent.json
  ansible.builtin.copy: 
    src: /operator/networkagent.json
    dest: /opt

- name: authenticate with the artefact repo
  raw: "cat /opt/networkagent.json | docker login -u _json_key --password-stdin https://{{GOOGLE_REGION}}-docker.pkg.dev"

- name: docker pull upf
  command: "docker pull {{GOOGLE_REGION}}-docker.pkg.dev/{{GOOGLE_PROJECT}}/networkagent/upf:latest"
