              ),
          )
          scheme_pattern = re.compile(
              r"(?i)(?<![A-Za-z0-9+.-])[A-Za-z][A-Za-z0-9+.-]{1,31}:"
              r"(?://|[\\/]|[A-Za-z0-9])"
          )
          protocol_relative_pattern = re.compile(
              r"(?<![:\\])//[^\s<>\"']+"
          )
          absolute_path_patterns = (
              re.compile(r"[A-Za-z]:[\\/]"),
              re.compile(r"\\\\(?:[?.]|GLOBALROOT)[\\/]", re.IGNORECASE),
              re.compile(r"\\[?]{2}[\\/]"),
