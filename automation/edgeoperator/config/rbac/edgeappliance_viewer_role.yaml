# permissions for end users to view edgeappliances.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: edgeappliance-viewer-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: operator
    app.kubernetes.io/part-of: operator
    app.kubernetes.io/managed-by: kustomize
  name: edgeappliance-viewer-role
rules:
- apiGroups:
  - network.example.com
  resources:
  - edgeappliances
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - network.example.com
  resources:
  - edgeappliances/status
  verbs:
  - get
