apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: firewalls.google.dev
  # labels:
  #   type: connectivitytest
spec:
  scope: Namespaced
  group: google.dev
  names:
    kind: Firewall
    plural: firewalls
    singular: firewall
    shortNames:
      - firewall
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                ingress:
                  description: |
                    Incoming firewall network location
                  type: string
                egress:
                  description: |
                    Outgoing firewall network location
                  type: string
                rules:
                  description: |
                    list of firewall rules
                  type: array
                  items:
                    type: object
                    properties:
                      protocol:
                        description: |
                          protocol e.g. tcp/udp/...
                        type: string
                      port:
                        description: |
                          port or port range
                        type: string

              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true