name: telco-assurance

on:
  push:
    paths:
      - "packages/telco-domain/**"
      - "packages/telco-lab/**"
      - "packages/telco-local/**"
      - "networkagents/assurance/**"
      - "data/rca-rules/**"
      - "data/samples/lte-demo/**"
      - "data/docs/lte/**"
      - "lib/pyproject.toml"
      - "lib/src/agent_library/agentmiddleware/adk.py"
      - "networkagents/supervisor/requirements.txt"
      - "networkagents/supervisor/src/agent/a2a_parts.py"
      - "networkagents/supervisor/src/agent/host_agent.py"
      - "networkagents/supervisor/src/agent/remote_agent_connection.py"
      - "networkagents/supervisor/src/endpoints/socketendpoint.py"
      - "networkagents/supervisor/src/utils/error_handler.py"
      - "networkagents/supervisor/test/**"
      - "tests/contracts/a2a/**"
      - "tests/e2e/local/**"
      - "tests/e2e/lab/**"
      - "tests/e2e/a2a/**"
      - "tools/local-stack/run_runtime_trace_demo.py"
      - "tools/local-stack/tests/test_run_runtime_trace_demo.py"
      - "tools/local-stack/tests/test_runtime_trace_evidence_workflow.py"
      - "docs/implementation-development-plan-2.0.md"
      - ".github/scripts/release_evidence.py"
      - ".github/scripts/test_release_evidence.py"
      - ".github/workflows/telco-assurance.yml"
  pull_request:
    paths:
      - "packages/telco-domain/**"
      - "packages/telco-lab/**"
      - "packages/telco-local/**"
      - "networkagents/assurance/**"
      - "data/rca-rules/**"
      - "data/samples/lte-demo/**"
      - "data/docs/lte/**"
      - "lib/pyproject.toml"
      - "lib/src/agent_library/agentmiddleware/adk.py"
      - "networkagents/supervisor/requirements.txt"
      - "networkagents/supervisor/src/agent/a2a_parts.py"
      - "networkagents/supervisor/src/agent/host_agent.py"
      - "networkagents/supervisor/src/agent/remote_agent_connection.py"
      - "networkagents/supervisor/src/endpoints/socketendpoint.py"
      - "networkagents/supervisor/src/utils/error_handler.py"
      - "networkagents/supervisor/test/**"
      - "tests/contracts/a2a/**"
      - "tests/e2e/local/**"
      - "tests/e2e/lab/**"
      - "tests/e2e/a2a/**"
      - "tools/local-stack/run_runtime_trace_demo.py"
      - "tools/local-stack/tests/test_run_runtime_trace_demo.py"
      - "tools/local-stack/tests/test_runtime_trace_evidence_workflow.py"
      - "docs/implementation-development-plan-2.0.md"
      - ".github/scripts/release_evidence.py"
      - ".github/scripts/test_release_evidence.py"
      - ".github/workflows/telco-assurance.yml"

permissions:
  contents: read

jobs:
  supervisor-adk-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: networkagents/supervisor/src

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            lib/pyproject.toml
            networkagents/supervisor/requirements.txt
      - name: Install the exact Supervisor interoperability boundary
        run: >-
          python -m pip install
          "google-adk==1.28.1"
          "a2a-sdk==0.3.11"
          "pytest>=8,<10"
          ./lib
      - name: Import Supervisor A2A modules and close a minimal ADK agent
        run: |
          python - <<'PY'
          import asyncio

          import agent.host_agent
          import agent.remote_agent_connection
          import agent_library.agentmiddleware.adk
          from google.adk import Agent
          from agent_library.agentmiddleware.adk import ADKAgent

          async def smoke() -> None:
              wrapper = ADKAgent(
                  adk_agent=Agent(name="p2b_smoke", model="gemini-2.5-flash"),
                  app_name="p2b_smoke",
                  use_in_memory_services=True,
              )
              await wrapper.close()

          asyncio.run(smoke())
          PY
      - name: Verify the complete Supervisor interoperability boundary
        run: |
          python -m pytest \
            networkagents/supervisor/test/test_a2a_parts.py \
            networkagents/supervisor/test/test_adk_continuation.py \
            networkagents/supervisor/test/test_host_tool_result_retry.py \
            networkagents/supervisor/test/test_remote_preflight.py \
            networkagents/supervisor/test/test_socket_tool_gate.py \
            -q
      - name: Verify Supervisor dependency consistency
        run: python -m pip check

  legacy-wire-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install only the isolated legacy A2A SDK
        run: python -m pip install "a2a-sdk==0.2.16"
      - name: Regenerate and compare the legacy wire fixture
        run: >-
          python tests/contracts/a2a/generate_legacy_fixture.py
          --check tests/contracts/a2a/fixtures/legacy-0.2.16.json
      - name: Prove that this job contains no current A2A SDK
        run: >-
          python -c "from importlib.metadata import version;
          assert version('a2a-sdk') == '0.2.16'"

  assurance-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      PYTHONPATH: networkagents/supervisor/src
      SOURCE_DATE_EPOCH: "946684800"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/telco-domain/pyproject.toml
            packages/telco-lab/pyproject.toml
            packages/telco-local/pyproject.toml
            networkagents/assurance/pyproject.toml
      - name: Exercise the fail-closed release-evidence boundary
        if: matrix.python-version == '3.12'
        run: python .github/scripts/test_release_evidence.py
      - name: Install Local Profile, Data Lab, Assurance Agent, and test dependencies
        run: |
          python -m pip install -e "packages/telco-domain[test]"
          python -m pip install -e "packages/telco-lab[test]"
          python -m pip install -e "packages/telco-local[test]"
          python -m pip install -e "networkagents/assurance[test]"
      - name: Prove the current A2A SDK is exact
        run: >-
          python -c "from importlib.metadata import version;
          assert version('a2a-sdk') == '0.3.11'"
      - name: Run prior regressions and P2b release tests
        run: |
          python -m pytest packages/telco-domain/tests -q
          python -m pytest packages/telco-lab/tests -q
          python -m pytest packages/telco-local/tests -q
          python -m pytest tests/e2e/lab -q
          python -m pytest tests/e2e/local -q
          python -m pytest networkagents/assurance/tests -q
          python -m pytest tests/contracts/a2a -q
          python -m pytest tests/e2e/a2a -q
          python -m pytest \
            tools/local-stack/tests/test_run_runtime_trace_demo.py \
            tools/local-stack/tests/test_runtime_trace_evidence_workflow.py \
            -q
      - name: Build all Local-profile wheels
        run: |
          python -m pip install "build>=1,<2"
          python -m build --wheel --outdir dist/domain packages/telco-domain
          python -m build --wheel --outdir dist/lab packages/telco-lab
          python -m build --wheel --outdir dist/local packages/telco-local
          python -m build --wheel --outdir dist/assurance networkagents/assurance
      - name: Smoke-test wheels outside the source tree
        run: |
          python -m pip uninstall -y telco-assurance-agent telco-local telco-lab telco-domain
          python -m pip install dist/domain/telco_domain-*.whl
          python -m pip install dist/lab/telco_lab-*.whl
          python -m pip install dist/local/telco_local-*.whl
          python -m pip install dist/assurance/telco_assurance_agent-*.whl
          cd /tmp
          python - <<'PY'
          import telco_assurance_agent
          import telco_domain
          import telco_lab
          import telco_local
          from importlib.metadata import version

          from telco_assurance_agent import (
              LOCAL_HTTP_API_VERSION,
              PACKAGE_VERSION,
              LocalServiceStatusApi,
          )
          from telco_assurance_agent.fault_receiver import LocalReplayFaultReceiver
          from telco_assurance_agent.governance_http import LocalGovernanceHttpApi
          from telco_lab import ReplayWirePayload, run_paced_replay

          assert version("a2a-sdk") == "0.3.11"
          assert version("telco-assurance-agent") == PACKAGE_VERSION == "0.1.0"
          assert LOCAL_HTTP_API_VERSION == "1.0"
          assert LocalServiceStatusApi.__module__ == "telco_assurance_agent.status_http"
          assert telco_domain.SCHEMA_VERSION == "1.0"
          assert ReplayWirePayload.model_fields["schema_version"].default == "1.0"
          assert callable(run_paced_replay)
          PY
          telco-assurance-agent --help
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Exercise fixed single-process runtime trace evidence
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          runtime_summary="$RUNNER_TEMP/local-runtime-trace-summary.json"
          python tools/local-stack/run_runtime_trace_demo.py --approve-local-simulation > "$runtime_summary"
          python - "$runtime_summary" <<'PY'
          import json
          import sys
          from pathlib import Path

          summary = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert summary["schema"] == "networkagent-local-runtime-trace-evidence/1.0"
          assert summary["classification"] == "LOCAL_SINGLE_PROCESS_LOOPBACK_TRACE_EVIDENCE"
          assert summary["ok"] is True
          assert summary["proof"]["event_count"] == 6
          assert summary["proof"]["component_count"] == 4
          assert summary["proof"]["single_correlation"] is True
          assert summary["proof"]["all_outcomes_ok"] is True
          assert summary["proof"]["expected_order"] is True
          assert summary["proof"]["binding_checks"] == 6
          assert summary["proof"]["successful_run_cleanup"] is True
          assert summary["release"] == {
              "eligible": True,
              "source_state": "COMMIT_BOUND",
          }
          assert summary["proof"]["write_semantics"] == {
              "canonical_domain_unchanged": True,
              "changed_table_count": 1,
              "transport_state_changed": True,
              "unchanged_table_count": 9,
              "whole_database_read_only_claimed": False,
          }
          assert summary["proof"]["governance_zero_delta"] == {
              "actions": 0,
              "approvals": 0,
              "executions": 0,
              "verifications": 0,
          }
          PY
      - name: Stage and verify bounded runtime trace release summary
        if: matrix.python-version == '3.12'
        run: |
          mkdir -p release-evidence
          cp "$RUNNER_TEMP/local-runtime-trace-summary.json" release-evidence/local-runtime-trace-summary.json
          python - <<'PY'
          import hashlib
          import json
          import os
          import stat
          from pathlib import Path

          summary_path = Path("release-evidence/local-runtime-trace-summary.json")
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          assert summary["source"]["commit_bound"] is True
          assert summary["source"]["binding_stable"] is True
          assert summary["source"]["tracked_clean"] is True
          assert summary["source"]["commit_sha"] == os.environ["GITHUB_SHA"]
          assert summary["release"] == {
              "eligible": True,
              "source_state": "COMMIT_BOUND",
          }
          assert summary["scope"] == {
              "action_mode": "DISABLED",
              "analyze_semantics": "TRANSPORT_WRITE_DOMAIN_UNCHANGED",
              "execution": "SINGLE_PROCESS",
              "network": "REAL_LOOPBACK_TCP",
              "scenario": "FIXED_BUBBLERAN_SINGLE_EVENT",
          }
          assert summary["privacy"] == {
              "absolute_paths_recorded": False,
              "domain_identifiers_recorded": False,
              "raw_events_in_release_summary": False,
              "raw_payloads_recorded": False,
              "status": "PASS",
          }
          forbidden_keys = {
              "body",
              "context_id",
              "idempotency_key",
              "incident_id",
              "metrics",
              "path",
              "resource_id",
              "source_event_id",
              "task_id",
              "trace_id",
              "workflow_id",
          }
          def nested_keys(value):
              if isinstance(value, dict):
                  return set(value).union(*(nested_keys(item) for item in value.values()))
              if isinstance(value, list):
                  return set().union(*(nested_keys(item) for item in value))
              return set()
          assert nested_keys(summary).isdisjoint(forbidden_keys)
          run_root = Path(".local/networkagent-runtime-trace")
          candidates = [item for item in run_root.iterdir() if item.is_dir()]
          assert len(candidates) == 1
          run_directory = candidates[0]
          children = tuple(run_directory.iterdir())
          assert {child.name for child in children} == {
              "local-runtime-events.jsonl",
              "local-runtime-trace-report.json",
          }
          assert all(
              not child.is_symlink()
              and stat.S_ISREG(os.lstat(child).st_mode)
              and os.lstat(child).st_nlink == 1
              for child in children
          )
          report_bytes = (run_directory / "local-runtime-trace-report.json").read_bytes()
          assert len(report_bytes) == summary["report"]["bytes"]
          assert hashlib.sha256(report_bytes).hexdigest() == summary["report"]["sha256"]
          persisted_body = json.loads(report_bytes)
          assert persisted_body == {
              key: value for key, value in summary.items() if key != "report"
          }
          assert nested_keys(persisted_body).isdisjoint(forbidden_keys)
          assert not list(Path("release-evidence").rglob("*.jsonl"))
          assert not list(Path("release-evidence").rglob("*.duckdb"))
          PY
      - name: Generate release evidence and audit runtime dependencies
        id: release_evidence
        if: matrix.python-version == '3.12'
        env:
          RELEASE_ARTIFACT_NAME: telco-assurance-release-py3.12-attempt-${{ github.run_attempt }}
        run: |
          python -m pip install \
            "pip-audit==2.10.1" \
            "setuptools>=77,<83" \
            "wheel>=0.45,<1"
          release_env="$RUNNER_TEMP/telco-assurance-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -m pip install \
            --ignore-installed \
            --target "$release_env" \
            dist/domain/telco_domain-*.whl \
            dist/lab/telco_lab-*.whl \
            dist/local/telco_local-*.whl \
            dist/assurance/telco_assurance_agent-*.whl
          mkdir -p release-evidence
          python .github/scripts/release_evidence.py inventory \
            --environment-path "$release_env" \
            --first-party "telco-domain" \
            --first-party "telco-lab" \
            --first-party "telco-local" \
            --first-party "telco-assurance-agent" \
            --output release-evidence/runtime-inventory.json \
            --requirements-output release-evidence/runtime-requirements.txt
          set +e
          python .github/scripts/release_evidence.py scan-wheels \
            --wheel-root dist \
            --output release-evidence/wheel-content-scan.json
          python -m pip_audit \
            --requirement release-evidence/runtime-requirements.txt \
            --no-deps \
            --disable-pip \
            --strict \
            --progress-spinner off \
            --timeout 30 \
            --format json \
            --output release-evidence/pip-audit.json
          audit_status=$?
          python -m pip_audit \
            --requirement release-evidence/runtime-requirements.txt \
            --no-deps \
            --disable-pip \
            --strict \
            --progress-spinner off \
            --timeout 30 \
            --format cyclonedx-json \
            --output release-evidence/pip-audit-sbom.cdx.json
          sbom_status=$?
          python .github/scripts/release_evidence.py finalize-sbom \
            --input release-evidence/pip-audit-sbom.cdx.json \
            --output release-evidence/sbom.cdx.json \
            --wheel-root dist \
            --runtime-inventory release-evidence/runtime-inventory.json \
            --runtime-requirements release-evidence/runtime-requirements.txt \
            --expected-wheel "telco_domain-*.whl" \
            --expected-wheel "telco_lab-*.whl" \
            --expected-wheel "telco_local-*.whl" \
            --expected-wheel "telco_assurance_agent-*.whl"
          finalize_status=$?
          if [ "$finalize_status" -ne 0 ]; then sbom_status=2; fi
          set -e
          python .github/scripts/release_evidence.py manifest \
            --wheel-root dist \
            --evidence-root release-evidence \
            --output release-evidence/release-manifest.json \
            --audit-report release-evidence/pip-audit.json \
            --audit-exit-code "$audit_status" \
            --expected-pip-audit-version "2.10.1" \
            --sbom release-evidence/sbom.cdx.json \
            --sbom-exit-code "$sbom_status" \
            --wheel-scan release-evidence/wheel-content-scan.json \
            --expected-wheel "telco_domain-*.whl" \
            --expected-wheel "telco_lab-*.whl" \
            --expected-wheel "telco_local-*.whl" \
            --expected-wheel "telco_assurance_agent-*.whl" \
            --expected-component "telco-domain" \
            --expected-component "telco-lab" \
            --expected-component "telco-local" \
            --expected-component "telco-assurance-agent" \
            --python-version "${{ matrix.python-version }}" \
            --artifact-name "$RELEASE_ARTIFACT_NAME" \
            --artifact-retention-days 14 \
            --supplemental-evidence release-evidence/local-runtime-trace-summary.json \
            --summary "$GITHUB_STEP_SUMMARY"
          python .github/scripts/release_evidence.py verify-manifest \
            --manifest release-evidence/release-manifest.json \
            --wheel-root dist \
            --evidence-root release-evidence \
            --expected-wheel "telco_domain-*.whl" \
            --expected-wheel "telco_lab-*.whl" \
            --expected-wheel "telco_local-*.whl" \
            --expected-wheel "telco_assurance_agent-*.whl" \
            --expected-component "telco-domain" \
            --expected-component "telco-lab" \
            --expected-component "telco-local" \
            --expected-component "telco-assurance-agent" \
            --audit-exit-code "$audit_status" \
            --sbom-exit-code "$sbom_status" \
            --expected-pip-audit-version "2.10.1" \
            --python-version "${{ matrix.python-version }}" \
            --artifact-name "$RELEASE_ARTIFACT_NAME" \
            --artifact-retention-days 14 \
            --supplemental-evidence release-evidence/local-runtime-trace-summary.json
      - name: Upload release or diagnostic evidence
        id: release_artifact
        if: ${{ always() && matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telco-assurance-release-py3.12-attempt-${{ github.run_attempt }}
          path: |
            dist/domain/*.whl
            dist/lab/*.whl
            dist/local/*.whl
            dist/assurance/*.whl
            release-evidence/*.json
            release-evidence/*.txt
          if-no-files-found: error
          retention-days: 14
      - name: Summarize uploaded artifact
        if: ${{ always() && matrix.python-version == '3.12' && steps.release_artifact.outcome == 'success' }}
        env:
          ARTIFACT_ID: ${{ steps.release_artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.release_artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.release_artifact.outputs.artifact-digest }}
          EVIDENCE_OUTCOME: ${{ steps.release_evidence.outcome }}
        run: |
          classification="DIAGNOSTIC ONLY"
          if [ "$EVIDENCE_OUTCOME" = "success" ] && python -c "import json; from pathlib import Path; raise SystemExit(0 if json.loads(Path('release-evidence/release-manifest.json').read_text())['status'] == 'PASS' else 1)"; then
            classification="VERIFIED RC"
          fi
          {
            echo "### Uploaded GitHub artifact"
            echo ""
            echo "- Classification: **$classification**"
            echo "- Artifact ID: \`$ARTIFACT_ID\`"
            echo "- Download URL: $ARTIFACT_URL"
            echo "- GitHub archive digest (not a wheel digest): \`$ARTIFACT_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
