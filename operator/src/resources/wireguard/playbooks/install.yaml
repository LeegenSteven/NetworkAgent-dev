- hosts: all
  become: True
  gather_facts: False
  tasks:

  - name: run install
    import_role:
      name: install

  - name: install node exporter 
    import_role:
      name: nodeexporter

  - name: run wireguard
    become: True
    ansible.builtin.systemd_service:
      state: restarted
      enabled: true
      name: wg-quick@wg0

    