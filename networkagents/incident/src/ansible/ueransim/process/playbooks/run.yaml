- hosts: all
  become: True
  gather_facts: True
  tasks:

  - name: Debug message - Starting UERANSIM process
    debug:
      msg: "Starting UERANSIM process playbook execution"

  - name: Debug message - System information
    debug:
      msg: "Running on host: {{ inventory_hostname }} with OS: {{ ansible_os_family }}"

  - name: Debug message - Current timestamp
    debug:
      msg: "Execution timestamp: {{ ansible_date_time.iso8601 }}"
