---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeNetwork
metadata:
  name: sydney
  labels:
    customer: acme
    graph: "true"
spec:
  routingMode: REGIONAL
  autoCreateSubnetworks: false
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeSubnetwork
metadata:
  name: sydney
  labels:
    customer: acme
    graph: "true"
spec:
  ipCidrRange: 10.0.70.0/24
  region: "europe-west1"
  description: sydney Network
  networkRef:
    name: sydney
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewall
metadata:
  name: sydney-allowed
  labels:
    customer: acme
    graph: "true"
spec:
  allow:
    - protocol: tcp
      ports:
       - "0-65535"
    - protocol: udp
      ports:
       - "0-65535"
    - protocol: icmp
  networkRef:
    name: sydney
  direction: INGRESS
  sourceRanges:
    - 0.0.0.0/0
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeInstance
metadata:
  annotations:
    cnrm.cloud.google.com/allow-stopping-for-update: "true"
  name: sydney-app1
  labels:
    customer: acme
    graph: "true"
spec:
  machineType: e2-standard-2
  zone: europe-west1-c
  bootDisk:
    initializeParams:
      size: 50
      type: pd-ssd
      sourceImageRef:
        external: ubuntu-os-cloud/ubuntu-2204-lts
  networkInterface:
    - subnetworkRef:
        external: "https://www.googleapis.com/compute/v1/projects/networkagent-434609/regions/europe-west1/subnetworks/mgmt-subnet"
    - subnetworkRef:
        name: sydney
  canIpForward: true
  metadataStartupScript: "sudo apt-get update;sudo apt-get install -yq python3;sudo ip route add 10.0.40.0/24 via 10.0.70.1;sudo ip route add 10.0.50.0/24 via 10.0.70.1;sudo ip route add 10.0.60.0/24 via 10.0.70.1;sudo ip route add 10.0.80.0/24 via 10.0.70.1"
  metadata:
    - key: ssh-keys
      value: laurent_ljulliard_altostrat_com:ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9m5nqFHpLycTbFGLGmrXSTCVeDYt/DG8LHE+ciAJKB networkagent
