[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-lab"
version = "0.1.0"
description = "Secure, reproducible open-data workspace for local telco assurance tests"
readme = "README.md"
license = "Apache-2.0"
license-files = ["THIRD_PARTY_DATA.md"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.5,<3",
    "pyarrow>=21,<26",
    "telco-domain>=0.1,<0.2",
]

[project.scripts]
telco-lab = "telco_lab.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.4,<10"]
dev = ["build>=1,<2", "pytest>=7.4,<10", "pytest-cov>=4,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
telco_lab = ["catalogs/*.json", "py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src", "../telco-domain/src"]
