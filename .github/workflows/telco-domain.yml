name: telco-domain

on:
  push:
    paths:
      - "packages/telco-domain/**"
      - ".github/workflows/telco-domain.yml"
  pull_request:
    paths:
      - "packages/telco-domain/**"
      - ".github/workflows/telco-domain.yml"

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/telco-domain/pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e "packages/telco-domain[test]"
      - name: Run offline contract tests
        run: python -m pytest packages/telco-domain/tests -q
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist packages/telco-domain
      - name: Smoke-test the built wheel outside the source tree
        run: |
          python -m pip uninstall -y telco-domain
          python -m pip install --no-deps dist/telco_domain-*.whl
          cd /tmp
          python -c "import telco_domain; assert telco_domain.SCHEMA_VERSION == '1.0'"
      - name: Verify dependency consistency
        run: python -m pip check
