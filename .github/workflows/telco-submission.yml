          def verify_private_projection(value, *, document):
              stack = [(value, ())]
              while stack:
                  item, context = stack.pop()
                  if isinstance(item, dict):
                      for key, nested in item.items():
                          normalized = re.sub(
                              r"[^a-z0-9]+", "_", key.lower()
                          ).strip("_")
                          if normalized == "path":
                              name = item.get("name")
                              if (
                                  document != "submission-index.json"
                                  or context != summary_context
                                  or key != "path"
                                  or set(item) != summary_keys
                                  or not isinstance(name, str)
                                  or re.fullmatch(
                                      r"[a-z0-9][a-z0-9._-]*\.json", name
                                  )
                                  is None
                                  or nested != f"release-evidence/{name}"
                              ):
                                  raise SystemExit(
                                      "private field entered submission"
                                  )
                          elif normalized in private_names:
                              raise SystemExit("private field entered submission")
                          stack.append((nested, context + (normalized,)))
                  elif isinstance(item, list):
                      stack.extend(
                          (nested, context + ("[]",)) for nested in item
                      )
                  elif isinstance(item, str):
                      verify_text_privacy(item)

